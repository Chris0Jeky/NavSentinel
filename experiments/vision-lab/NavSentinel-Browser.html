function finishReplay(){const s=scenario(st.selected),t=performance.now(),result=C.evaluate(s.event,st.policy);st.lastDuration=performance.now()-t;const r=addRecord(s,result);st.current=r.id;st.finished=true;st.step=3;running=false;save();render();toast(`${s.label}: ${result.decision}. A fixture receipt was recorded.`);if(st.mode!=='extension')openDetail(r.id);}
function runReplay(){if(running)return;const resume=st.view==='overview'&&st.step>=0&&!st.finished;if(st.view!=='overview')st.view='overview';if(!resume)resetReplay();running=true;const token=++runToken;if(!resume)st.step=0;render();const tick=()=>{if(token!==runToken)return;if(st.step>=2){finishReplay();return;}st.step++;render();setTimeout(tick,650);};setTimeout(tick,650);}
function stepReplay(){runToken++;running=false;if(st.finished)resetReplay();st.step++;if(st.step>=3)finishReplay();else render();}
function runSuite(){const t=performance.now();const results=S.map(s=>{const r=C.evaluate(s.event,st.policy);return {id:s.id,expected:s.expected,actual:r.decision,wouldDecide:r.wouldDecide,score:r.score,match:r.decision===s.expected};});st.suite={results,duration:performance.now()-t,mode:st.policy.mode};st.view='lab';render();toast(`${results.filter(r=>r.match).length} of ${S.length} Smart-contract expectations matched in ${st.policy.mode} mode.`);}
function openDetail(id){const r=st.records.find(x=>x.id===id);if(!r)return;drawerId=id;const s=scenario(r.scenarioId),result=r.snapshot||C.evaluate(s.event,r.policySnapshot||st.policy),facts=correctionsFor(id),g=grant?.receiptId===id?grant:null;

{b('Allow once · rehearsal','approve-demo','key','primary')}${b('Dismiss review','dismiss-review','close','ghost')}</div>`:''}${g?`<div class="api-result"><div class="row between"><strong>Exact-context demo grant</strong>${badge(g.used?'review':'allow',g.used?'CONSUMED / BURNED':'ONE USE')}</div><p class="subtext mt8" style="font-size:10px">Expires ${esc(new Date(g.expiresAt).toLocaleTimeString())}. No real action will execute.</p><div class="row mt wrap">${b('Consume','consume-demo','check','ghost small')}${b('Change document','mismatch-demo','flask','ghost small')}${b('Force expiry','expire-demo','clock','ghost small')}</div>${g.message?`<p class="mono mt8">${esc(g.message)}</p>`:''}</div>`:''}<h3 class="mt">Add a correction, not a rewrite</h3><div class="row mt8 wrap">${b('Should allow','correct','check','ghost small','data-kind="should-allow"')}${b('Should block','correct','shield','ghost small','data-kind="should-block"')}${b('Unsure','correct','info','ghost small','data-kind="uncertain"')}</div><p class="subtext mt8" style="font-size:10px">Corrections do not train a model or silently add trust. Your original decision stays intact.</p><div class="mt">${facts.map(f=>`<div class="trust-item">${icon(f.kind==='capability-rejected'?'shield':'journal')}<span class="grow">${esc(f.kind)}</span><span class="mono faint">${esc(new Date(f.timestamp).toLocaleTimeString())}</span></div>`).join('')||'<p class="faint" style="font-size:10px">No later facts recorded.</p>'}</div></div>`;if(!drawer.open)drawer.showModal();}
function consumeDemo(variation){const r=st.records.find(x=>x.id===drawerId);if(!r||!grant||grant.receiptId!==r.id)throw Error('No current rehearsal grant.');const wasUsed=grant.used;grant.used=true;if(variation==='expire')grant.expiresAt=Date.now()-1;const event=structuredClone(grant.event);if(variation==='mismatch')event.context.document+='-different';const accepted=!wasUsed&&grant.expiresAt>Date.now()&&C.sameContext(event,grant.event);grant.message=accepted?'Accepted once. Inert rehearsal only.':'Rejected: '+(wasUsed?'grant already consumed.':grant.expiresAt<=Date.now()?'grant expired.':'document binding mismatch; grant burned.');correction(r,accepted?'capability-consumed':'capability-rejected');openDetail(r.id);render();toast(grant.message,!accepted);}
function exportData(){return {schema:1,prototype:C.VERSION,evidenceCeiling:'Synthetic fixture and cooperative broker records. Not real-world security efficacy.',exportedAt:new Date().toISOString(),records:st.records.map(r=>({id:String(r.id),timestamp:String(r.timestamp),scenarioId:r.scenarioId,journeyId:String(r.journeyId||''),source:C.origin(r.source),destination:C.origin(r.destination),action:r.action,decision:r.decision,score:Number(r.score)||0,evidence:r.evidence,sourceKind:r.sourceKind,seeded:!!r.seeded,signalIds:(r.signalIds||r.signals||[]).filter(x=>Object.hasOwn(C.REGISTRY,x))})),corrections:st.corrections.map(c=>({receiptId:c.receiptId,kind:c.kind,timestamp:c.timestamp}))};}
const download=globalThis.NSRenderer.download;
function showExport(){const data=exportData(),bytes=new TextEncoder().encode(JSON.stringify(data)).length;showDialog('Inspect before it leaves.',`<p class="subtext">${data.records.length} decision records and ${data.corrections.length} later facts. ${(bytes/1024).toFixed(1)} KiB. Exporting creates a local file, not an upload.</p><div class="mt">${note('The serializer allowlists metadata. No DOM, passwords, clipboard content, tokens, request bodies, URL paths, or query strings are exported. Origins can still reveal the sites represented in the journal.')}</div><pre class="code-block mt" style="max-height:320px;overflow:auto">${esc(JSON.stringify(data,null,2))}</pre>`,b('Download redacted JSON','download-export','download','primary')+b('Cancel','close-dialog','','ghost'));}
function compareProfiles(){showDialog('Same evidence. Different policy.',`<p class="subtext">Smart is the reference expectation for these contracts. Strict can add interruptions. Observe reports only and never models enforcement.</p><div class="table-wrap mt"><table class="table"><thead><tr><th>FIXTURE</th><th>SMART</th><th>STRICT</th><th>OBSERVE</th></tr></thead><tbody>${S.map(s=>`<tr><td>${esc(s.label)}<div class="table-sub">${esc(s.kind)}</div></td>${['smart','strict','observe'].map(mode=>{const r=C.evaluate(s.event,{...st.policy,mode});return `<td>${badge(r.decision)}${mode==='observe'?`<div class="table-sub">would ${esc(r.wouldDecide)}</div>`:''}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div><div class="mt">${note('This is a deterministic comparison of invented fixtures, not a false-positive or detection-rate estimate.')}</div>`,b('Done','close-dialog','','primary'));}
function about(){showDialog('Three products. Honest boundaries.',`<div class="stack"><div class="evidence-box"><h3>01 / Browser guardian</h3><p class="subtext mt8">The studio replays modeled consequences. The separate unpacked extension includes real opt-in DOM sensing, click/submit interception, overlay cleanup, and extension-origin Undo for narrow implemented fixture paths; live extension behavior requires separate validation.</p></div><div class="evidence-box"><h3>02 / Desktop companion</h3><p class="subtext mt8">A working investigation workspace, data-flow explorer, local journal, corrections, recovery rehearsal, and optional Electron shell. No system clipboard watcher, process controller, network filter, or antivirus is installed.</p></div><div class="evidence-box"><h3>03 / Intent Relay</h3><p class="subtext mt8">A real loopback API with authenticated principals, operator review, exact-context grants, expiry, replay rejection, and a hash-chained local journal. It can increment one fixed local fixture counter; external proposals produce inert receipts. Agents must cooperate; this does not contain a hostile process.</p></div><p class="subtext">Grounded in NavSentinel’s interaction-integrity, local-evidence, Proving Ground, and frozen Horizon designs. This is an isolated experiment, not a new upstream release or evidence that any upstream milestone is complete.</p>${note('The shared-chat page did not expose its message body during research. Grounding came from repository source, issues, roadmap, architecture documents, and available project context.')}</div>`,b('Run the fixture suite','suite','flask','primary')+b('Close','close-dialog','','ghost'));}
function install(){showDialog('Try the real browser fixture lab.',`<p class="subtext">The visual studio is immediately usable offline. To try the unpacked extension, use the source bundle on your computer.</p><pre class="code-block mt">cd NavSentinel-Vision-Lab\nnode daemon/server.cjs</pre><div class="timeline mt"><div class="timeline-step"><span class="step-number">1</span><div><strong>Open Chrome’s extensions page</strong><p>Enable Developer mode. Choose Load unpacked and select the bundle’s <span class="mono">extension</span> directory.</p></div></div><div class="timeline-step"><span class="step-number">2</span><div><strong>Open the inert fixture site</strong><p>Visit <span class="mono">http://127.0.0.1:4319</span>. Open the NavSentinel Lab toolbar popup and choose Enable on this site. Reload the fixture page.</p></div></div><div class="timeline-step"><span class="step-number">3</span><div><strong>Compare effects, not notifications</strong><p>Try the overlay, destination mismatch, unsafe form, and benign controls. The sink counter is outside the extension. Use the popup for authoritative Undo.</p></div></div></div>${note('Use a separate browser profile. The lab extension is not the repository’s production build. Programmatic submission, arbitrary network requests, hostile MAIN-world interception, closed-shadow content, and OS execution are not universally protected.')}`,b('Done','close-dialog','','primary'));}
function showContract(id){const s=scenario(id||st.selected);showDialog(s.title,`<div class="row">${badge('fixture',s.kind)}${badge(s.expected,'SMART: '+s.expected)}</div><p class="subtext mt">${esc(s.story)}</p><div class="timeline mt">${s.steps.map((x,i)=>`<div class="timeline-step"><span class="step-number">${i+1}</span><div><strong>${esc(typeof x==='string'?x:x.title)}</strong>${typeof x==='object'?`<p>${esc(x.detail||x.description||'')}</p>`:''}</div></div>`).join('')}</div><pre class="code-block mt">${esc(JSON.stringify(s.event,null,2))}</pre><div class="mt">${note(esc(s.limitation||'Synthetic metadata only. Passing this contract says nothing about a live sensor’s coverage.'))}</div>`,b('Play fixture','run-specific','play','primary',`data-id="${s.id}"`)+b('Close','close-dialog','','ghost'));}
function connectDialog(){if(!/^http:\/\/127\.0\.0\.1:\d+$/.test(location.origin)&&!globalThis.navDesktop){showDialog('Start the local service first.',`<p class="subtext">This file is an offline preview. It does not reach across origins to a local daemon. Run the bundle, then use the studio served from its loopback address.</p><pre class="code-block mt">node daemon/server.cjs\n\nOpen http://127.0.0.1:4318/?mode=relay</pre><p class="subtext mt">The operator token is printed in that terminal. Paste it into Connect broker in the served studio. No token is saved by the renderer.</p>`,b('Done','close-dialog','','primary'));return;}showDialog('Connect the local intent broker.',`<p class="subtext">Paste the operator token printed by <span class="mono">node daemon/server.cjs</span>. This session sends only to its own loopback origin. Your token stays in memory.</p><label class="field-label mt" for="broker-token">Operator session token</label><input class="text-input" type="password" id="broker-token" autocomplete="off" spellcheck="false" placeholder="Session token">`,b('Connect','connect-submit','link','primary')+b('Cancel','close-dialog','','ghost'));}
async function api(path,body){if(!/^\/api\/(health|state|request|approve|consume|revoke|scenario)$/.test(path))throw Error('Unsupported API path');let data,status;if(globalThis.navDesktop){const response=await globalThis.navDesktop.request({path,method:body?'POST':'GET',body});({data,status}=response);}else{const response=await fetch(path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),Authorization:`Bearer ${apiToken}`},body:body?JSON.stringify(body):undefined,credentials:'omit',cache:'no-store'});status=response.status;data=await response.json();}if(status<200||status>=300){const e=Error(data.error||'Request rejected');e.status=status;throw e;}return data;}
async function refreshService(){health=await api('/api/health');remote=await api('/api/state');connected=true;}
async function requestLive(){const id=$('#request-scenario')?.value||'agent-review',fixture=id==='fixture-auto'||id==='fixture-review',s=scenario(fixture?(id==='fixture-auto'?'newtab':'agent-review'):id),event=structuredClone(s.event);event.id=uid();if(id==='newtab'||fixture)event.action='navigate';if(fixture){if(!health?.fixtureAdapter)throw Error('Local fixture adapter is unavailable.');event.destination=id==='fixture-auto'?health.fixtureAdapter.autoDestination:health.fixtureAdapter.reviewDestination;event.signals=id==='fixture-auto'?['accessible_control']:['agent_outside_scope'];}liveRequest=await api('/api/request',{event});liveOutcome=null;addRecord(s,liveRequest.result,{event:liveRequest.event,sourceKind:'broker'});save();await refreshService();render();}
async function consumeLive(mismatch=false){if(!liveRequest?.capability)throw Error('No live grant.');const event=structuredClone(liveRequest.event);if(mismatch)event.context.document+='-different';try{const data=await api('/api/consume',{token:liveRequest.capability.token,event});liveOutcome={status:'Accepted once',message:data.effect};}catch(e){liveOutcome={status:'Rejected',message:e.message};}await refreshService();render();}
function palette(){const commands=[['Browser / current page','mode','extension'],['Desktop / Protection Center','mode','desktop'],['Intent Relay / control room','mode','relay'],['Run current scenario','run',''],['Run all fixture contracts','suite',''],['Decision journal','nav','journal'],['Trust and rules','nav','rules'],['Settings and data','nav','settings'],['Connect local broker','connect',''],['Export redacted evidence','export','']];showDialog('Find a view or action.',`<input class="text-input" id="command-search" placeholder="Type to filter commands…" aria-label="Search commands" autofocus><div class="mt" id="command-results">${commands.map(([text,action,value])=>`<button class="command-item" data-action="${action}" data-mode="${value}" data-view="${value}">${icon(action==='mode'?(modes[value]?.icon||'arrow'):'arrow')}<span>${text}</span></button>`).join('')}</div>`);$('#command-search')?.focus();}
async function action(target){const a=target.dataset.action;if(!a)return;const d=target.dataset;
 if(a==='close-dialog'){closeDialog();return;}if(a==='close-drawer'){drawer.close();return;}
 if(a==='mode'||a==='nav'){if(dialog.open)closeDialog();navigate(a==='mode'?'overview':d.view,a==='mode'?d.mode:st.mode);return;}
 if(a==='run'||a==='run-specific'){if(dialog.open)closeDialog();if(drawer.open)drawer.close();if(a==='run-specific'){resetReplay();st.selected=scenario(d.id).id;save();}runReplay();return;}
 if(a==='pause'){runToken++;running=false;render();return;}if(a==='step'){stepReplay();return;}if(a==='reset'){resetReplay();render();return;}
 if(a==='inspect'){st.inspect=!st.inspect;render();return;}
 if(a==='undo-fixture'||a==='undo'){if(!st.current)throw Error('Replay a cleanup scenario first.');st.undo=!st.undo;if(st.undo)correction(st.records.find(r=>r.id===st.current),'undo');render();toast(st.undo?'Fixture overlay restored. No blocked click was replayed.':'Fixture cleanup reapplied.');return;}
 if(a==='detail'){openDetail(d.id||st.current);return;}
 if(a==='correct'){const r=st.records.find(x=>x.id===drawerId);if(r){correction(r,d.kind);openDetail(r.id);render();toast('Correction added. The original decision is unchanged.');}return;}
 if(a==='dismiss-review'){const r=st.records.find(x=>x.id===drawerId);if(r){correction(r,'dismissed');openDetail(r.id);render();}return;}
 if(a==='approve-demo'){const r=st.records.find(x=>x.id===drawerId);if(!r||!activeReview(r)||!r.snapshot?.overridable||r.sourceKind==='broker')throw Error('This review cannot be approved here.');grant={receiptId:r.id,event:C.normalizeEvent(scenario(r.scenarioId).event),expiresAt:Date.now()+30000,used:false};correction(r,'approved-once');openDetail(r.id);render();return;}
 if(['consume-demo','mismatch-demo','expire-demo'].includes(a)){consumeDemo(a==='mismatch-demo'?'mismatch':a==='expire-demo'?'expire':'normal');return;}
 if(a==='demo-approval'){const s=scenario('agent-review'),r=addRecord(s,C.evaluate(s.event,{...st.policy,mode:'smart'}));save();render();openDetail(r.id);return;}
 if(a==='suite'){if(dialog.open)closeDialog();runSuite();return;}
 if(a==='lab-filter'){labFilter=d.filter;render();return;}if(a==='journal-filter'){st.filter=d.filter;render();return;}
 if(a==='profile'){st.policy=C.normalizePolicy({...st.policy,mode:d.profile});save();render();toast('Preview profile updated. Earlier records are unchanged.');return;}
 if(a==='add-host'){const key=d.list;if(!['navigationHosts','credentialHosts'].includes(key))return;const host=C.normalizeHost($('#'+key+'-input').value);if(st.policy[key].includes(host))throw Error('That exact host is already listed.');st.policy=C.normalizePolicy({...st.policy,[key]:[...st.policy[key],host]});save();render();toast('Exact-host preference added for future replays.');return;}
 if(a==='remove-host'){if(!['navigationHosts','credentialHosts'].includes(d.list))return;st.policy[d.list]=st.policy[d.list].filter(x=>x!==d.host);save();render();return;}
 if(a==='case'){st.case=d.case;render();return;}if(a==='flow-node'){st.flowNode=d.node;render();return;}
 if(a==='run-cross'){for(const id of['clickfix','shell']){const s=scenario(id);addRecord(s,C.evaluate(s.event,st.policy));}save();st.case='verification-trap';st.selected='shell';navigate('investigations','desktop');toast('Two correlated fixture stages recorded. No clipboard or process was inspected.');return;}
 if(a==='compare'){const s=scenario(st.selected),r=C.evaluate(s.event,st.policy);showDialog('What changes at this boundary?',`<p class="subtext">${esc(s.story)}</p><div class="two-col mt"><div class="evidence-box"><div class="eyebrow">WITHOUT A MEDIATOR / MODELED</div><h3 class="mt8">Consequence proceeds</h3><p class="subtext mt8">The fixture’s declared ${esc(s.event.action)} reaches its proposed destination. This is a counterfactual, not a live browser measurement.</p></div><div class="evidence-box"><div class="eyebrow">WITH THIS POLICY / MODELED</div><h3 class="mt8">${esc(r.headline)}</h3><p class="subtext mt8">${r.score} heuristic points. ${esc(r.explanation)}</p>${badge(r.decision)}</div></div><div class="mt">${note('Use the separate loopback fixture lab and browser test receipts to compare actual sink effects.')}</div>`,b('Done','close-dialog','','primary'));return;}
 if(a==='compare-policy'){compareProfiles();return;}if(a==='about'){about();return;}if(a==='install'){install();return;}if(a==='scenario-info'){showContract(d.id);return;}
 if(a==='registry'){showDialog('A shared, typed signal vocabulary.',`<p class="subtext">Group caps reduce double counting. Negative signals cannot erase hard invariants. These weights are experimental, not calibrated.</p><div class="mt">${Object.entries(C.REGISTRY).map(([id,c])=>`<div class="signal-row"><div>${esc(c.label)}<div class="signal-meta">${esc(id)} · ${esc(c.evidence)}${c.hard?' · HARD INVARIANT':''}</div></div><span class="points">${c.points>0?'+':''}${c.points}</span></div>`).join('')}</div>`,b('Done','close-dialog','','primary'));return;}
 if(a==='load-policy'){policyText=JSON.stringify(scenario($('#policy-scenario').value).event,null,2);policyResult=null;render();return;}if(a==='evaluate-policy'){policyText=$('#policy-json').value;policyResult=C.evaluate(JSON.parse(policyText),st.policy);render();toast('Dry run complete. No action was executed.');return;}
 if(a==='export'){showExport();return;}if(a==='download-export'){download('navsentinel-redacted-receipts.json',exportData());closeDialog();toast('Local redacted export created.');return;}
 if(a==='export-config'){download('navsentinel-preview-policy.json',{schema:1,policy:st.policy});return;}if(a==='import-config'){$('#config-file')?.click();return;}
 if(a==='apply-import'){if(!pendingImport)throw Error('No validated import.');st.policy=pendingImport;pendingImport=null;save();closeDialog();render();toast('Validated preview policy imported.');return;}
 if(['clear-history','reset-settings','seed','reset-recovery'].includes(a)){const text={'clear-history':'Clear the demo journal and later corrections? Your policy, installed extension, and daemon journal are untouched.','reset-settings':'Reset the preview policy and trust lists? Decision history is preserved.','seed':'Replace the demo history with six clearly marked example records? Your current policy is preserved.','reset-recovery':'Clear the rehearsal checklist? No system changes will be made.'}[a];showDialog('Confirm the scope.',`<p class="subtext">${text}</p>`,b('Confirm','confirm-reset','check','primary',`data-reset="${a}"`)+b('Cancel','close-dialog','','ghost'));return;}
 if(a==='confirm-reset'){if(d.reset==='reset-settings')st.policy=C.normalizePolicy({});if(d.reset==='reset-recovery')st.recovery=[false,false,false,false,false];if(['clear-history','seed'].includes(d.reset)){st.records=[];st.corrections=[];grant=null;resetReplay();if(d.reset==='seed')for(const id of['oauth','newtab','overlay','first-login','clickfix','shell']){const s=scenario(id);addRecord(s,C.evaluate(s.event,st.policy),{seeded:true});}}save();closeDialog();render();toast('The selected reset is complete.');return;}
 if(a==='export-recovery'){download('navsentinel-recovery-rehearsal.md',`# NavSentinel recovery rehearsal\n\nThis is a planning checklist, not proof that recovery actions were completed.\nNo system changes were performed by this prototype.\n\n${recoveryTasks.map((t,i)=>`- [${st.recovery[i]?'x':' '}] ${t[0]}: ${t[1]}`).join('\n')}\n\nGenerated ${new Date().toISOString()}\n`,'text/markdown');return;}
 if(a==='connect'){connectDialog();return;}if(a==='connect-submit'){apiToken=$('#broker-token').value.trim();try{await refreshService();closeDialog();render();toast('Authenticated loopback session connected.');}catch(e){apiToken='';connected=false;throw e;}return;}
 if(a==='disconnect'){apiToken='';connected=false;remote=null;liveRequest=null;liveOutcome=null;render();toast('Renderer disconnected. Existing service grants expire independently.');return;}
 if(a==='refresh-service'){await refreshService();render();toast('Local service state refreshed.');return;}if(a==='api-request'){await requestLive();return;}if(a==='api-approve'){const data=await api('/api/approve',{requestId:liveRequest.requestId});liveRequest.capability=data.capability;await refreshService();render();return;}
 if(a==='api-consume'||a==='api-mismatch'){await consumeLive(a==='api-mismatch');return;}
 if(a==='revoke-service'){await api('/api/revoke',{});liveRequest=null;await refreshService();closeDialog();render();toast('All outstanding service capabilities revoked.');return;}
 if(a==='api-help'){showDialog('The cooperative broker protocol.',`<pre class="code-block">POST /api/request   { event }\nPOST /api/approve   { requestId }   [operator]\nGET  /api/request?requestId=…       [owner]\nPOST /api/consume   { token, event }\nPOST /api/revoke    {}              [operator]\nGET  /api/state                    [operator]</pre><p class="subtext mt">All privileged calls need a bearer token. Client identity comes from that token, not the submitted event. Grants bind the normalized full event, including document and destination, and expire after 30 seconds.</p><pre class="code-block mt">node daemon/server.cjs\n# In a second terminal:\nnode examples/agent.cjs</pre>${note('The fixed local fixture adapter increments a loopback counter. Other approved requests only record a receipt. It cannot execute shell commands, upload files, fetch arbitrary destinations, or prevent a non-cooperating program from doing so.')}`,b('Done','close-dialog','','primary'));return;}
 if(a==='service-info'){showDialog('Local service status.',`<p class="subtext">${connected?'Authenticated session.':'Offline preview. No authenticated service session.'}</p><pre class="code-block mt">${esc(JSON.stringify(health||{broker:'not connected',osHooks:false},null,2))}</pre><div class="mt">${note('A consistent hash chain detects accidental or partial modification. It is not a digital signature, and it cannot prove authenticity against an attacker who can rewrite the entire local journal.')}</div>`,(connected?b('Revoke outstanding grants','revoke-service','key','ghost'):'')+b('Done','close-dialog','','primary'));return;}
 if(a==='palette'){palette();return;}
 toast(`No action is implemented for ${a}.`,true);
}
document.addEventListener('click',e=>{const target=e.target instanceof Element?e.target.closest('[data-action]'):null;if(!target||target.disabled)return;Promise.resolve(action(target)).catch(error=>toast(error.message,true));});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='journal-search'){st.search=t.value;$('#journal-table').innerHTML=recentTable(250,filteredRecords(),'Your local record');}if(t.id==='policy-json')policyText=t.value;if(t.id==='attention-range'){st.policy.attentionLimit=Number(t.value);$('#attention-output').textContent=`${t.value} cards`;save();}if(t.id==='command-search'){const q=t.value.toLowerCase();document.querySelectorAll('#command-results button').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q));}});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='scenario-select'||t.id==='flow-scenario'){st.selected=scenario(t.value).id;resetReplay();save();render();}if(t.dataset.recovery!==undefined){st.recovery[Number(t.dataset.recovery)]=t.checked;save();render();}if(t.id==='config-file'&&t.files?.[0]){const file=t.files[0];if(file.size>65536)throw Error('Configuration file exceeds 64 KiB.');const json=JSON.parse(await file.text());if(json.schema!==1||!json.policy)throw Error('Unsupported configuration schema.');pendingImport=C.normalizePolicy(json.policy);showDialog('Preview the imported settings.',`<pre class="code-block">${esc(JSON.stringify(pendingImport,null,2))}</pre><p class="subtext mt">Only these preview preferences will change. The journal and service contracts are untouched.</p>`,b('Apply settings','apply-import','check','primary')+b('Cancel','close-dialog','','ghost'));}}catch(error){toast(error.message,true);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();}const t=e.target;if((e.key==='Enter'||e.key===' ')&&t instanceof Element&&t.getAttribute('role')==='button'&&t.dataset.action){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
for(const el of[dialog,drawer])el.addEventListener('click',e=>{if(e.target===el){const r=el.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)el.close();}});
render();
if(globalThis.navDesktop)refreshService().then(()=>render()).catch(e=>toast(`Desktop broker unavailable: ${e.message}`,true));
})();
