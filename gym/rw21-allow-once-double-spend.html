<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RW-21 - Allow-Once Double Spend</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 42px 18px;
        background: #f8f6f3;
        color: #1a1a1a;
      }
      .card {
        padding: 26px;
        border-radius: 18px;
        border: 1px solid #e0dcd6;
        background: white;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      }
      button {
        min-height: 48px;
        margin-top: 18px;
        padding: 0 22px;
        border: none;
        border-radius: 12px;
        background: #2b6cb0;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>RW-21: Allow-once double spend</h1>
      <p>
        After the user allows one popup, the attacker immediately fires a second
        popup to spend the allow-window. NavSentinel should block the second action.
      </p>
      <button id="rw21Action" type="button">Open account settings</button>
      <div id="status"></div>
    </section>

    <script>
      document.getElementById('rw21Action').addEventListener('click', () => {
        // First popup: legitimate settings page
        window.open(
          'rw21-settings-popup.html?step=settings',
          'rw21-settings',
          'popup,width=420,height=620'
        );

        // Second popup: abuse attempt spending the allow-gesture
        window.setTimeout(() => {
          window.open(
            'rw21-exfil-popup.html?step=exfil',
            'rw21-exfil',
            'popup,width=420,height=620'
          );
          document.getElementById('status').textContent =
            'Second popup fired — should be blocked.';
        }, 80);
      });
    </script>
  </body>
</html>
