<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Sim 02 - Delayed Password (multi-step login)</title>
    <style>
      /*
        P4-01b visual-similarity fixture - delayed / multi-step login.

        No password field exists at load. Clicking "Next" injects one, mirroring
        the multi-step (identifier-first) flows used by Google, Microsoft, etc.
        This exercises NavSentinel's `waitForPasswordFieldThenRun` MutationObserver
        path: the visual-sim capture pipeline must fire only AFTER the password
        field appears, not at initial load.

        Because the password field is injected on a button click the test
        controls, an E2E can install its capture spy BEFORE the field appears,
        giving a race-free assertion that the capture pipeline ran.
      */
      :root {
        color-scheme: light;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f5f9;
      }
      .card {
        width: 360px;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d8dde6;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(20, 30, 60, 0.08);
      }
      h1 {
        text-align: center;
        font-size: 20px;
        margin: 0 0 24px;
        color: #1f2937;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: #4b5563;
      }
      input {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid #cbd2dc;
        border-radius: 8px;
      }
      button {
        font: inherit;
        padding: 11px 12px;
        margin-top: 6px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      <form id="loginForm" action="#" method="post" onsubmit="return false">
        <label>
          Email
          <input id="username" name="username" type="email" autocomplete="username" value="user@example.com" />
        </label>
        <div id="passwordSlot"></div>
        <button id="nextBtn" type="button">Next</button>
      </form>
    </main>
    <script>
      // Inject the password step on demand. The E2E clicks #nextBtn after
      // installing its capture spy so the resulting visual-sim capture is
      // observed deterministically (no load-time race).
      document.getElementById("nextBtn").addEventListener("click", () => {
        const slot = document.getElementById("passwordSlot");
        if (slot.querySelector('input[type="password"]')) return;
        const label = document.createElement("label");
        label.textContent = "Password";
        const input = document.createElement("input");
        input.id = "password";
        input.name = "password";
        input.type = "password";
        input.setAttribute("autocomplete", "current-password");
        label.appendChild(input);
        slot.appendChild(label);
        input.focus();
      });
    </script>
  </body>
</html>
