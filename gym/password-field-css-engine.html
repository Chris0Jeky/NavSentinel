<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password field CSS engine fixture</title>
    <!-- The extension reads this cross-origin resource through its real SRI gate. -->
    <link rel="stylesheet" href="http://localhost:9/missing.css" />
  </head>
  <body>
    <form id="login" action="https://example.invalid/submit" method="post">
      <label>
        Password
        <input id="password" type="password" name="password" />
      </label>
      <button type="submit">Submit</button>
    </form>
    <script>
      const style = new URLSearchParams(location.search).get("style");
      if (style !== null) document.getElementById("password").setAttribute("style", style);
    </script>
  </body>
</html>
