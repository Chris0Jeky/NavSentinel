<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evasion 02 - 34% viewport overlay</title>
  <style>
    body { font-family: sans-serif; padding: 24px; margin: 0; }
    .real-link {
      display: block;
      padding: 16px 32px;
      background: #1a73e8;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      width: 240px;
      margin: 80px auto;
    }
    /*
      34% of viewport — just under the old 35% binary threshold.
      Using vw/vh units to approximate: sqrt(0.34) ~ 0.583
      58.3% width * 58.3% height ~ 34% area
    */
    .overlay {
      position: fixed;
      top: 20%;
      left: 20%;
      width: 58.3vw;
      height: 58.3vh;
      background: rgba(200, 0, 0, 0.05);
      z-index: 10000;
      cursor: pointer;
    }
    .info {
      max-width: 600px;
      margin: 0 auto;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="info">
    <p><a href="index.html">&larr; Back to Gym index</a></p>
    <h1>Evasion 02 - 34% Viewport Coverage</h1>
    <p>
      An interactive overlay covering ~34% of the viewport, just under the old
      35% binary threshold. With gradient scoring this should trigger
      <code>overlay_medium_interactive</code>.
    </p>
  </div>

  <a class="real-link" href="https://example.com">Real Link</a>

  <!-- Attacker overlay: ~34% of viewport, just under old 35% threshold -->
  <a class="overlay" href="https://evil.example.com"></a>
</body>
</html>
