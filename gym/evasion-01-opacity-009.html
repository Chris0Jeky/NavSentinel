<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evasion 01 - Opacity 0.09</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 24px;
      max-width: 700px;
    }
    #legit-link {
      display: inline-block;
      padding: 14px 28px;
      font-size: 18px;
      background: #1a73e8;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
    }
    /*
     * Evasion technique: opacity 0.09 — just above the 0.08 "invisible" cutoff.
     * The overlay is still "visible" to isVisible(), so it won't get the full
     * invisible_but_clickable penalty (25). Instead it lands in the
     * near_invisible_opacity gradient (0.08-0.15), scoring ~14 points.
     *
     * Expected CDS contributions:
     *   near_invisible_opacity               ~14 (opacity 0.09)
     *   no_accessible_name                    15 (anchor with no text/aria)
     *   cursor_pointer_no_affordance           10 (pointer + no name + opacity < 0.3)
     *   intent_mismatch_under_interactive      35 (underlying legit link)
     * Total ~ 74 -> should be caught in smart mode (threshold 70)
     */
    #trap {
      position: fixed;
      inset: 0;
      opacity: 0.09;
      z-index: 10000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Evasion 01: Opacity 0.09 (near-invisible)</h1>
  <p>
    The overlay uses opacity 0.09 — just above the 0.08 invisibility threshold.
    This tests whether the gradient penalty in near_invisible_opacity catches
    nearly-invisible elements that technically pass the isVisible() check.
  </p>

  <a id="legit-link" href="https://example.com/safe" aria-label="Safe destination link">
    Click here for safe content
  </a>

  <!-- Evasion overlay: near-invisible anchor covering viewport -->
  <a id="trap" href="https://evil.example/evasion01" target="_blank" rel="noreferrer"></a>
</body>
</html>
