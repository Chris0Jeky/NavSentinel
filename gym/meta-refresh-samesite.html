<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Continue</title>
  <meta http-equiv="refresh" content="300, URL='meta-refresh-samesite.html?next=account'" />
  <style>
    body { font-family: sans-serif; background: #f6f7f9; margin: 0; }
    .note { margin: 16px; padding: 12px; background: #d4edda; border: 1px solid #28a745; }
    .card { width: 380px; margin: 24px auto; background: #fff; border-radius: 12px; padding: 28px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px; }
    button { background: #222; color: #fff; border: 0; border-radius: 4px; padding: 10px 16px; }
  </style>
</head>
<body>
  <p class="note">Gym contrast (#1144): the same continue layout, but the pending meta refresh stays on this site. Use dummy credentials only.</p>
  <form class="card" action="" method="post">
    <h1>Continue</h1>
    <p>Your session is moving to your account.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit">Continue</button>
  </form>
</body>
</html>
