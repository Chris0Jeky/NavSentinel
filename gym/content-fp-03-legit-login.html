<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyApp - Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 440px;
        margin: 60px auto;
        padding: 0 16px;
        background: #fafafa;
        color: #333;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }

      .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 24px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: block;
        font-size: 13px;
        color: #555;
        margin-bottom: 4px;
      }

      input {
        font: inherit;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
      }

      button {
        font: inherit;
        background: #4a90d9;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
      }

      .note {
        background: #d4edda;
        border: 1px solid #28a745;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 16px;
        font-size: 13px;
        color: #155724;
      }

      .footer {
        text-align: center;
        margin-top: 16px;
        font-size: 12px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="note">
      <strong>Gym fixture:</strong> Legitimate login page. Content fingerprinting
      must NOT trigger on this page. No brand impersonation, no phishing kit
      signatures, no suspicious form actions.
    </div>

    <div class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your MyApp account</p>

      <form action="/api/auth/login" method="post">
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>

        <button type="submit">Sign in</button>
      </form>

      <p class="footer">
        Don't have an account? <a href="/signup">Create one</a>
      </p>
    </div>
  </body>
</html>
