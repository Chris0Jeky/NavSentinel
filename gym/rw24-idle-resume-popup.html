<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RW-24 - Idle-Resume Popup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 42px 18px;
        background: #fff9f0;
        color: #1a1a1a;
      }
      .card {
        padding: 26px;
        border-radius: 18px;
        border: 1px solid #f0e0c8;
        background: white;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      }
      button {
        min-height: 48px;
        margin-top: 18px;
        padding: 0 22px;
        border: none;
        border-radius: 12px;
        background: #e17055;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      #timer {
        margin-top: 14px;
        font-size: 13px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>RW-24: Idle-resume popup attempt</h1>
      <p>
        After a long idle period (simulated via setTimeout), a popup fires when the
        user gesture has long expired. NavSentinel should block this as stale.
      </p>
      <button id="rw24Trigger" type="button">Check for updates</button>
      <div id="timer"></div>
    </section>

    <script>
      document.getElementById('rw24Trigger').addEventListener('click', () => {
        const timerEl = document.getElementById('timer');
        timerEl.textContent = 'Waiting for idle period...';

        // Fire a popup well after the allow-window has expired
        window.setTimeout(() => {
          timerEl.textContent = 'Idle period elapsed — firing popup now.';
          window.open(
            'rw24-stale-popup.html?step=update',
            'rw24-stale',
            'popup,width=420,height=620'
          );
        }, 6000);
      });
    </script>
  </body>
</html>
