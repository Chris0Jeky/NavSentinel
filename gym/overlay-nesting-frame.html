<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay nesting child frame</title>
  <style>
    html, body { min-height: 100%; margin: 0; }
    body { box-sizing: border-box; padding: 24px; font: 16px/1.45 system-ui, sans-serif; background: #e8f5e9; }
    .attack {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      background: rgba(40, 18, 52, 0.94);
      color: white;
    }
    .wrapper { position: static; }
    #benign-dialog { background: #fff; color: #222; }
    #low-z-overlay { z-index: 99; background: rgba(30, 60, 90, 0.82); }
    #small-overlay { inset: 12px auto auto 12px; width: 120px; height: 72px; font-size: 11px; }
    #compact-hostile { inset: 12px auto auto 12px; width: 51vw; height: 51vh; }
  </style>
  <script>
    const fixtureCase = new URLSearchParams(location.search).get("case") || "exact";

    function writeStaticContainer(frame, label) {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.open();
      doc.write(`<!doctype html><html><head><style>
        html,body{width:100%;height:100%;margin:0}
        #container{display:block;width:100%;height:100%;cursor:pointer;padding:40px;box-sizing:border-box;background:rgba(255,255,255,.8)}
        .card{display:grid;place-items:center;width:100%;height:100%;background:#d9d9d9;color:#111;font:700 18px system-ui}
      </style></head><body><div id="container"><div class="card">${label}</div></div></body></html>`);
      doc.close();
    }

    function addHtmlDirectFrame(id, label) {
      const frame = document.createElement("iframe");
      frame.id = id;
      frame.dataset.attack = "true";
      frame.setAttribute("aria-label", label);
      frame.style.cssText = "width:100%!important;height:100%!important;position:fixed!important;left:0!important;right:0!important;top:0!important;bottom:0!important;z-index:2147483647!important;padding:0!important;margin:0!important;border:0!important";
      document.documentElement.appendChild(frame);
      writeStaticContainer(frame, label);
      return frame;
    }

    function addAlertFloodForms(count) {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < count; index += 1) {
        const form = document.createElement("form");
        form.id = `alert-flood-${index}`;
        form.action = `/baseline-${index}`;
        form.hidden = true;
        fragment.appendChild(form);
      }
      document.body.appendChild(fragment);
    }

    function rewriteAttackDisplay(id) {
      const attack = document.getElementById(id);
      if (!attack) return;
      attack.style.setProperty("display", "block", "important");
      document.documentElement.dataset.hostilePhase = "style-rewritten";
    }

    function replaceAttack(id, nextId) {
      document.getElementById(id)?.remove();
      addHtmlDirectFrame(nextId, "Reinserted synthetic advertisement");
      document.documentElement.dataset.hostilePhase = "node-reinserted";
    }

    if (fixtureCase === "exact" || fixtureCase === "multiple" || fixtureCase === "hostile") {
      addHtmlDirectFrame("exact-overlay-frame", "Synthetic nested advertisement");
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.documentElement.dataset.fixtureReady = "true";

      if (fixtureCase === "hostile") {
        // A page can replace the realm-visible composedPath method after the
        // document-start fence has registered. Some cross-world/shadow paths
        // are also retargeted to the host in real Chrome. Preserve the host in
        // the path while hiding the extension-owned inner control so the
        // regression proves Dismiss/Undo do not depend on page-visible shadow
        // internals.
        const pageComposedPath = Event.prototype.composedPath;
        Event.prototype.composedPath = function retargetExtensionControlPath() {
          const path = pageComposedPath.call(this);
          const hostIndex = path.findIndex((node) =>
            node instanceof HTMLElement && node.id === "__navsentinel_toast_host"
          );
          return hostIndex >= 0 ? path.slice(hostIndex) : path;
        };
        document.documentElement.dataset.controlPathRetargeted = "true";

        // The page realm can also replace ordinary Web IDL accessors after the
        // fence installs. Redirect extension-host mouse coordinates toward the
        // cleanup Undo button and hide Enter/Space from the keyboard path. A
        // safe fence must use the pristine accessors captured at document start.
        const nativeClientX = Object.getOwnPropertyDescriptor(
          MouseEvent.prototype,
          "clientX",
        ).get;
        const nativeClientY = Object.getOwnPropertyDescriptor(
          MouseEvent.prototype,
          "clientY",
        ).get;
        const nativeKey = Object.getOwnPropertyDescriptor(
          KeyboardEvent.prototype,
          "key",
        ).get;
        const extensionHost = (event) => pageComposedPath.call(event).find((node) =>
          node instanceof HTMLElement && node.id === "__navsentinel_toast_host"
        );
        const spoofedUndoCoordinate = (event, axis) => {
          const undo = [...(extensionHost(event)?.shadowRoot
            ?.querySelectorAll("[data-ns-ui-action]") ?? [])]
            .find((control) => control.textContent?.trim() === "Undo");
          if (!undo) return null;
          const rect = undo.getBoundingClientRect();
          return axis === "x"
            ? rect.left + rect.width / 2
            : rect.top + rect.height / 2;
        };
        document.documentElement.dataset.poisonedMouseFieldReads = "0";
        document.documentElement.dataset.poisonedKeyFieldReads = "0";
        Object.defineProperty(MouseEvent.prototype, "clientX", {
          configurable: true,
          get() {
            const coordinate = spoofedUndoCoordinate(this, "x");
            if (coordinate === null) return nativeClientX.call(this);
            document.documentElement.dataset.poisonedMouseFieldReads = String(
              Number(document.documentElement.dataset.poisonedMouseFieldReads) + 1,
            );
            return coordinate;
          },
        });
        Object.defineProperty(MouseEvent.prototype, "clientY", {
          configurable: true,
          get() {
            const coordinate = spoofedUndoCoordinate(this, "y");
            if (coordinate === null) return nativeClientY.call(this);
            document.documentElement.dataset.poisonedMouseFieldReads = String(
              Number(document.documentElement.dataset.poisonedMouseFieldReads) + 1,
            );
            return coordinate;
          },
        });
        Object.defineProperty(KeyboardEvent.prototype, "key", {
          configurable: true,
          get() {
            if (!extensionHost(this)) return nativeKey.call(this);
            document.documentElement.dataset.poisonedKeyFieldReads = String(
              Number(document.documentElement.dataset.poisonedKeyFieldReads) + 1,
            );
            return "Escape";
          },
        });
        document.documentElement.dataset.controlFieldsPoisoned = "true";

        document.documentElement.dataset.pageControlEventCount = "0";
        const status = document.createElement("p");
        status.id = "hostile-click-status";
        status.textContent = "Page-level control events observed: 0";
        const churn = document.createElement("button");
        churn.id = "trigger-scroll-churn";
        churn.type = "button";
        churn.textContent = "Trigger scroll-time reinsertion";
        churn.addEventListener("click", () => window.dispatchEvent(new Event("scroll")));
        document.body.append(status, churn);
        const recordControlEvent = (event) => {
          const current = Number(document.documentElement.dataset.pageControlEventCount ?? "0");
          document.documentElement.dataset.pageControlEventCount = String(current + 1);
          status.textContent = `Page-level control events observed: ${current + 1} (last: ${event.type})`;
        };
        for (const type of [
          "pointerdown", "pointerup", "pointercancel", "mousedown", "mouseup",
          "touchstart", "touchend", "touchcancel", "click", "dblclick",
          "auxclick", "contextmenu", "keydown", "keyup",
        ]) {
          window.addEventListener(type, recordControlEvent, { capture: true });
        }

        // These forms exist before NavSentinel's opt-in monitor snapshots the
        // document. Rewriting them later fills the ordinary alert lane without
        // touching the overlay itself, matching an ad-heavy page whose unrelated
        // churn exhausted the old cleanup path.
        addAlertFloodForms(50);
        setTimeout(() => {
          for (let index = 0; index < 50; index += 1) {
            document.getElementById(`alert-flood-${index}`)
              ?.setAttribute("action", `/changed-${index}`);
          }
          document.documentElement.dataset.hostilePhase = "alert-lane-filled";
        }, 900);
        setTimeout(() => rewriteAttackDisplay("exact-overlay-frame"), 1800);
        setTimeout(() => replaceAttack(
          "exact-overlay-frame",
          "reinserted-overlay-frame",
        ), 3200);
        window.addEventListener("scroll", () => {
          if (document.getElementById("scroll-overlay-frame")) return;
          addHtmlDirectFrame("scroll-overlay-frame", "Scroll-triggered advertisement");
          document.documentElement.dataset.hostilePhase = "scroll-reinserted";
        }, { once: true });
      }

      if (fixtureCase === "body" || fixtureCase === "multiple") {
        const overlay = document.createElement("div");
        overlay.id = "body-overlay";
        overlay.className = "attack";
        overlay.dataset.attack = "true";
        overlay.textContent = "Body-direct overlay";
        document.body.appendChild(overlay);
      }

      if (fixtureCase === "wrapper" || fixtureCase === "multiple") {
        const wrapper = document.createElement("div");
        wrapper.className = "wrapper";
        const overlay = document.createElement("div");
        overlay.id = "wrapped-overlay";
        overlay.className = "attack";
        overlay.dataset.attack = "true";
        overlay.textContent = "One-wrapper overlay";
        wrapper.appendChild(overlay);
        document.body.appendChild(wrapper);
      }

      if (fixtureCase === "delayed") {
        setTimeout(() => addHtmlDirectFrame(
          "delayed-overlay-frame",
          "Delayed synthetic advertisement",
        ), 1200);
      }

      if (fixtureCase === "compact-hostile") {
        const overlay = document.createElement("a");
        overlay.id = "compact-hostile";
        overlay.className = "attack";
        overlay.dataset.attack = "true";
        overlay.href = "https://popup.invalid/";
        overlay.target = "_blank";
        overlay.textContent = "Compact interactive attack — expected hidden";
        document.body.appendChild(overlay);
      }

      if (fixtureCase === "benign") {
        const dialog = document.createElement("div");
        dialog.id = "benign-dialog";
        dialog.className = "attack";
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.textContent = "Accessible dialog — expected visible";
        document.body.appendChild(dialog);

        const lowZ = document.createElement("div");
        lowZ.id = "low-z-overlay";
        lowZ.className = "attack";
        lowZ.textContent = "Low-z layer — expected visible";
        document.body.appendChild(lowZ);

        const small = document.createElement("div");
        small.id = "small-overlay";
        small.className = "attack";
        small.textContent = "Small benign control — expected visible";
        document.body.appendChild(small);
      }
    }, { once: true });
  </script>
</head>
<body>
  <h1 id="underlay">Nested frame content exposed</h1>
  <p>The outer media frame intentionally has no qualifying stacking level.</p>
</body>
</html>
