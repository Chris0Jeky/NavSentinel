<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Early inline clock replacement</title>
    <script>
      // The bridge posts through natives captured at document_start (#1141), so
      // a page script cannot observe it; the spec records bridge traffic from a
      // Playwright init script that runs before the extension's prelude.
      Date.now = () => 7;
    </script>
  </head>
  <body>Early inline clock replacement fixture</body>
</html>
