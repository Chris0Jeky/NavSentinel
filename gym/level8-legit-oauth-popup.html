<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Level 8 - Legit OAuth Popup</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    #signin { padding: 16px 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Level 8: Legit "Sign in" popup</h1>
  <p>This mimics a common legit case: a deliberate popup for auth.</p>
  <button id="signin">Sign in</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const usePopupFeatures = params.get('plain') !== '1';
    const burst = params.get('burst') === '1';

    document.getElementById('signin').addEventListener('click', () => {
      window.open(
        'https://example.com/?oauth=1',
        usePopupFeatures ? 'oauth' : '',
        usePopupFeatures ? 'popup,width=520,height=640' : undefined
      );

      if (burst) {
        window.setTimeout(() => {
          window.open('https://example.com/?oauth=2', 'oauth-burst', 'popup,width=520,height=640');
        }, 50);
      }
    });
  </script>
</body>
</html>
