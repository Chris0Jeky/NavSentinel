<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>NavSentinel inert local fixture sink</title>
  <style>
    body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
    code { overflow-wrap: anywhere; }
  </style>
  <script>
    (() => {
      "use strict";
      const EXPECTED_SENTINEL = "NAVSENTINEL_SENTINEL_DO_NOT_RUN";
      const LOOPBACK_HOSTS = new Set(["127.0.0.1", "localhost", "[::1]"]);
      const CONSEQUENCES = Object.freeze({
        benign: "benign-navigation",
        harm: "wrong-target-navigation",
      });
      const SCENARIO_CONSEQUENCES = Object.freeze({
        "NS-ADV-WIN-001": "unauthorized-browsing-context",
      });
      const params = new URLSearchParams(location.search);
      const role = params.get("role") || "";
      const scenarioId = params.get("scenario_id") || "";
      const consequence = params.get("consequence") || "";
      const expectedConsequence = role === "harm"
        ? (SCENARIO_CONSEQUENCES[scenarioId] || CONSEQUENCES.harm)
        : CONSEQUENCES[role];
      const valid = location.protocol === "http:" &&
        LOOPBACK_HOSTS.has(location.hostname) &&
        Object.hasOwn(CONSEQUENCES, role) &&
        expectedConsequence === consequence &&
        /^NS-ADV-[A-Z0-9-]+$/u.test(scenarioId) &&
        params.get("sentinel") === EXPECTED_SENTINEL;

      const root = document.documentElement;
      root.dataset.fixtureSinkValid = valid ? "1" : "0";
      root.dataset.fixtureSinkRole = valid ? role : "rejected";
      root.dataset.fixtureSinkScenario = valid ? scenarioId : "rejected";
      root.dataset.harmReached = valid && role === "harm" ? "1" : "0";
      root.dataset.benignCompleted = valid && role === "benign" ? "1" : "0";

      document.addEventListener("DOMContentLoaded", () => {
        const title = document.querySelector("h1");
        const detail = document.querySelector("#detail");
        if (title) title.textContent = valid ? "Synthetic consequence received" : "Synthetic sink rejected the request";
        if (detail) {
          detail.textContent = valid
            ? "The local sink accepted one inert sentinel. No external action was attempted."
            : "The request did not satisfy the local typed-sink contract.";
        }
      }, { once: true });
    })();
  </script>
</head>
<body>
  <main>
    <h1>Local fixture sink</h1>
    <p id="detail">Validating the inert request.</p>
  </main>
</body>
</html>
