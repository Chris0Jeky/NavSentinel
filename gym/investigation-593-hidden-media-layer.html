<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue 593 modelled hidden-media layer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a27; }
    #player { position: relative; width: min(760px, 92vw); aspect-ratio: 16 / 9; overflow: hidden; background: #182c3f; box-shadow: 0 16px 50px #0008; }
    #player-poster { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 65% 20%, #4c84a8, #182c3f 60%); }
    #visible-player-control { position: absolute; inset: auto 24px 24px; min-height: 44px; color: white; background: #0d1520cc; border: 1px solid #b7e6ff99; border-radius: 6px; }
    /* MODELLED: an iframe-sized interactive layer that a user cannot reasonably see. */
    #hidden-media-layer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0.015; z-index: 10; pointer-events: auto; }
    #fixture-status { position: fixed; left: -10000px; top: auto; }
  </style>
</head>
<body>
  <main id="player" aria-label="Modelled embedded media player">
    <div id="player-poster"><strong>Modelled media player</strong></div>
    <button id="visible-player-control" type="button">Play visible media</button>
    <iframe id="hidden-media-layer" title="MODELLED hidden interactive media layer"></iframe>
  </main>
  <output id="fixture-status" aria-live="polite"></output>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const arm = params.get("arm") || "unarmed";
      const primitive = params.get("primitive") || "child-assign";
      const delay = params.get("delay") || "100";
      const rawSink = params.get("sink") || "";
      const status = document.getElementById("fixture-status");
      const diagnostics = [];
      const scenarioId = "issue-593-hidden-media-layer-modelled";
      const consequence = "modelled-hidden-media-navigation";
      const sentinel = "NAVSENTINEL_SENTINEL_DO_NOT_RUN";
      const allowedDelays = new Map([
        ["child-assign", new Set([100, 1600])],
        ["top-assign", new Set([100, 1600])],
        ["window-open", new Set([100])],
      ]);
      const delayMs = Number(delay);
      const armIsAllowed = allowedDelays.get(primitive)?.has(delayMs) && arm === `${primitive}-${delayMs}`;

      const safeSink = (() => {
        try {
          const target = new URL(rawSink);
          const targetId = target.searchParams.get("target_id") || "";
          const expectedRun = `${scenarioId}-${arm}`;
          const expectedTarget = /^(baseline|protected)-(child-assign-(100|1600)|top-assign-(100|1600)|window-open-100)$/u;
          const exactKeys = ["run_id", "scenario_id", "role", "consequence", "target_id", "sentinel"];
          const exactContract = target.searchParams.size === exactKeys.length && exactKeys.every((key) =>
            target.searchParams.getAll(key).length === 1
          );
          return armIsAllowed && target.protocol === "http:" && target.hostname === "127.0.0.1" &&
            Number(target.port) >= 46100 && Number(target.port) <= 46124 &&
            !target.username && !target.password && !target.hash &&
            target.pathname === "/__navsentinel_fake_sink" && exactContract &&
            target.searchParams.get("run_id") === expectedRun &&
            target.searchParams.get("scenario_id") === scenarioId &&
            target.searchParams.get("role") === "attack" &&
            target.searchParams.get("consequence") === consequence &&
            target.searchParams.get("sentinel") === sentinel &&
            expectedTarget.test(targetId) && targetId.endsWith(`-${arm}`) ? target.href : "";
        } catch {
          return "";
        }
      })();

      function record(entry) {
        const complete = { arm, frame: "parent", at: Math.round(performance.now()), ...entry };
        diagnostics.push(complete);
        document.documentElement.dataset.issue593Diagnostics = JSON.stringify(diagnostics);
        status.textContent = `${complete.phase || "event"}:${complete.primitive || primitive}`;
        console.info(`NAVSENTINEL_ISSUE593:${JSON.stringify(complete)}`);
      }

      window.addEventListener("message", (event) => {
        if (event.source !== document.getElementById("hidden-media-layer")?.contentWindow) return;
        if (!event.data || event.data.source !== "navsentinel-issue593") return;
        record(event.data.entry || { phase: "invalid-child-message" });
      });

      const childUrl = new URL("/investigation-593-hidden-media-child.html", location.origin);
      childUrl.searchParams.set("arm", arm);
      childUrl.searchParams.set("primitive", primitive);
      childUrl.searchParams.set("delay", delay);
      if (safeSink) childUrl.searchParams.set("sink", safeSink);
      document.getElementById("hidden-media-layer").src = childUrl.href;
      document.documentElement.dataset.fixtureReady = "1";
      record({ phase: "parent-ready", primitive, delayMs, armAllowed: !!armIsAllowed, sinkArmed: !!safeSink });
    })();
  </script>
</body>
</html>
