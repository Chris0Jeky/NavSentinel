<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Log in to PayPal</title>
  <link rel="canonical" href="https://www.paypal.com/signin" />
  <style>
    body { font-family: sans-serif; background: #f5f7fa; margin: 0; }
    .note { margin: 16px; padding: 12px; background: #d4edda; border: 1px solid #28a745; }
    .card { width: 360px; margin: 24px auto; background: #fff; border-radius: 12px; padding: 28px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px; }
    button { background: #003087; color: #fff; border: 0; border-radius: 16px; padding: 10px 18px; }
  </style>
</head>
<body>
  <p class="note">Gym contrast: the same PayPal login layout on the real paypal.com host.</p>
  <form class="card" action="https://www.paypal.com/signin" method="post">
    <h1>PayPal</h1>
    <p>Log in to pay or send money.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit">Log In</button>
  </form>
</body>
</html>
