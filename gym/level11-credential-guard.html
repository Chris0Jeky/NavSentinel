<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 11 - Credential Guard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 12px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 12px;
        background: #fafafa;
      }

      input,
      button {
        font: inherit;
        padding: 10px 12px;
      }

      .note {
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Level 11 - Credential Guard</h1>
    <p class="note">
      This page simulates a password form that posts to a different origin over HTTP. The credential guard should prompt before submit.
    </p>

    <form id="loginForm" action="http://127.0.0.1:9/fake-login" method="post">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" value="alice@example.com" />
      </label>

      <label>
        Password
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          value="hunter2"
        />
      </label>

      <button id="submitBtn" type="submit">Sign in</button>
    </form>
  </body>
</html>
