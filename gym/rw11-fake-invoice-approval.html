<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RW-11 - Fake Invoice Approval</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 18px 56px;
        background: #f4f7fb;
        color: #182434;
      }
      .shell {
        padding: 28px;
        border-radius: 22px;
        border: 1px solid #d7e0ea;
        background: #fff;
        box-shadow: 0 12px 26px rgba(18, 32, 49, 0.08);
      }
      .eyebrow {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #57697e;
      }
      .invoice {
        position: relative;
        margin-top: 24px;
        padding: 22px;
        border-radius: 18px;
        border: 1px solid #dde5ee;
        background: linear-gradient(180deg, #ffffff, #f7fafc);
      }
      #rw11Review {
        min-height: 48px;
        padding: 0 20px;
        border: none;
        border-radius: 12px;
        background: #146a59;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      #rw11Trap {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: block;
        opacity: 0.01;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0 20px;
      }
      .metric {
        padding: 14px;
        border-radius: 14px;
        background: #edf4fb;
      }
    </style>
  </head>
  <body>
    <section class="shell">
      <p class="eyebrow">Billing dashboard</p>
      <h1>RW-11: Fake invoice approval button</h1>
      <p>
        The card looks like a normal invoice review flow. The visible approval control is covered
        by an invisible new-tab trap that goes somewhere unrelated.
      </p>

      <div class="invoice">
        <a id="rw11Trap" href="rw11-unrelated-payout.html?via=invoice" target="_blank" rel="noopener"></a>
        <h2>Invoice #49318</h2>
        <div class="summary">
          <div class="metric"><strong>Vendor</strong><br />North Coast Logistics</div>
          <div class="metric"><strong>Due today</strong><br />GBP 4,860.00</div>
          <div class="metric"><strong>Approver</strong><br />Finance Ops</div>
        </div>
        <button id="rw11Review" type="button">Review invoice</button>
      </div>
    </section>
  </body>
</html>
