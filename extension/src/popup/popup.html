<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavSentinel</title>
    <link rel="stylesheet" href="../shared/design_tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero section">
        <div class="eyebrow">Local-first browser defense</div>
        <div class="hero-row">
          <div>
            <h1 class="title">NavSentinel <span id="version" class="version-tag"></span></h1>
            <div class="hero-copy">
              Current-tab control tower for deceptive navigation and credential risk.
            </div>
          </div>
          <div class="hero-mark" aria-hidden="true">NS</div>
        </div>

        <div class="site-panel">
          <div class="label">Current site</div>
          <div id="site" class="site mono">-</div>
          <div id="trustStatus" class="status-pill" aria-live="polite" aria-atomic="true">-</div>
        </div>
      </header>

      <section class="section">
        <div class="section-head">
          <div>
            <div class="label">Protection posture</div>
            <h2 class="section-title">Quick controls</h2>
          </div>
        </div>

        <div class="control-grid">
          <label class="control-card" for="navMode">
            <span class="card-kicker">Navigation mode</span>
            <span class="card-copy">
              Tunes click-deception gating, popup/new-tab prompts, and rollback behavior.
            </span>
            <select id="navMode" class="select">
              <option value="off">Off</option>
              <option value="smart">Smart</option>
              <option value="strict">Strict</option>
            </select>
          </label>

          <label class="control-card" for="credMode">
            <span class="card-kicker">Credential mode</span>
            <span class="card-copy">
              Prompts before risky password submits or untrusted password-field activity.
            </span>
            <select id="credMode" class="select">
              <option value="off">Off</option>
              <option value="smart">Smart</option>
              <option value="strict">Strict</option>
            </select>
          </label>
        </div>

        <div class="row action-row">
          <button id="trustBtn" class="btn primary">Trust site</button>
          <button id="untrustBtn" class="btn danger">Remove trust</button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <div class="label">Recent events</div>
            <h2 class="section-title">Latest signals</h2>
          </div>
          <button class="link" id="openOptions">Open options</button>
        </div>

        <div id="events" class="events">Loading...</div>

        <div class="row footer-row">
          <div class="hint">Local log only. Nothing leaves the browser.</div>
          <button id="refreshBtn" class="btn subtle">Refresh</button>
        </div>
      </section>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
