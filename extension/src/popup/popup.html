<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavSentinel</title>
    <link rel="stylesheet" href="../shared/design_tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="wrap ns-root">
      <!-- Hero header -->
      <header class="hero">
        <div class="hero-row">
          <div id="logoSlot" class="hero-logo" aria-hidden="true"></div>
          <div class="hero-info">
            <div class="hero-title ns-serif">NavSentinel</div>
            <div class="hero-meta ns-mono">
              <span class="status-dot status-dot--green"></span>
              <span id="version"></span> · armed
            </div>
          </div>
          <button id="openOptions" class="icon-btn" aria-label="Open dashboard">
            <span id="gearIcon"></span>
          </button>
        </div>

        <!-- Current page card -->
        <div class="site-card">
          <div class="site-card-row">
            <div id="shieldArc" class="shield-arc" aria-label="Tab risk score"></div>
            <div class="site-info">
              <div class="site-host-row">
                <span id="trustDot" class="status-dot"></span>
                <span id="site" class="site-host ns-mono">-</span>
              </div>
              <div class="site-meta">
                <span id="trustStatus" class="trust-pill ns-uc" aria-live="polite" aria-atomic="true">-</span>
                <span id="sessionMeta" class="session-meta ns-mono"></span>
              </div>
            </div>
            <button id="trustBtn" class="trust-btn trust-btn--trust">Trust</button>
            <button id="untrustBtn" class="trust-btn trust-btn--untrust" hidden>Untrust</button>
          </div>

          <!-- Active signals -->
          <div id="signals" class="signals-row"></div>
        </div>
      </header>

      <!-- Mode strip -->
      <section class="mode-strip">
        <div class="mode-card mode-card--nav">
          <div class="mode-card-head">
            <span id="navIcon" class="mode-icon"></span>
            <span class="mode-label ns-uc">nav</span>
          </div>
          <div class="seg" id="navSeg" role="radiogroup" aria-label="Navigation guard mode">
            <button class="seg-btn" role="radio" data-value="off" tabindex="-1" aria-checked="false">Off</button>
            <button class="seg-btn" role="radio" data-value="smart" tabindex="0" aria-checked="true">Smart</button>
            <button class="seg-btn" role="radio" data-value="strict" tabindex="-1" aria-checked="false">Strict</button>
          </div>
        </div>
        <div class="mode-card mode-card--cred">
          <div class="mode-card-head">
            <span id="credIcon" class="mode-icon"></span>
            <span class="mode-label ns-uc">cred</span>
          </div>
          <div class="seg" id="credSeg" role="radiogroup" aria-label="Credential guard mode">
            <button class="seg-btn" role="radio" data-value="off" tabindex="-1" aria-checked="false">Off</button>
            <button class="seg-btn" role="radio" data-value="smart" tabindex="0" aria-checked="true">Smart</button>
            <button class="seg-btn" role="radio" data-value="strict" tabindex="-1" aria-checked="false">Strict</button>
          </div>
        </div>
      </section>

      <!-- Activity feed -->
      <section class="activity">
        <div class="activity-head">
          <span class="activity-label ns-uc">activity</span>
          <div class="activity-sparkline">
            <span id="eventCount" class="event-count ns-mono"></span>
          </div>
        </div>
        <div id="events" class="events">Loading...</div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <span class="footer-local">
          <span id="lockIcon"></span>
          everything stays local
        </span>
        <button id="refreshBtn" class="footer-link">
          Refresh <span id="chevronIcon"></span>
        </button>
      </footer>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
