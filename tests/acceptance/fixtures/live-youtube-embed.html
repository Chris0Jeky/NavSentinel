<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Acceptance - real third-party video embed</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    iframe { border: 0; }
  </style>
</head>
<body>
  <h1>Real third-party video embed (live lane only)</h1>
  <p>An ordinary publisher page embedding YouTube's privacy-enhanced player.
     Clicking the player's own YouTube link is a navigation the user asked for.</p>
  <iframe id="player" width="640" height="360"
    src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE"
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <p><a id="docs" href="https://developers.google.com/youtube/iframe_api_reference">Player API documentation</a></p>
</body>
</html>
