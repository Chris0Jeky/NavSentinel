<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Acceptance - form posted into a hidden named iframe</title></head>
<body>
  <h1>Background form post into a named iframe</h1>
  <p>The page posts a form into its own hidden iframe (analytics, SSO keep-alive,
     upload targets). The top-level page never navigates.</p>
  <iframe name="sink" id="sink" style="width:1px;height:1px;border:0;position:absolute;left:-10px"></iframe>
  <form id="beacon" method="POST" target="sink"><input type="hidden" name="t" value="1" /></form>
  <script>
    const other = new URLSearchParams(location.search).get("cross") === "1";
    const host = other ? (location.hostname === "127.0.0.1" ? "localhost" : "127.0.0.1") : location.hostname;
    document.getElementById("beacon").action = `http://${host}:${location.port}/acceptance/dest/iframe-post/landing.html`;
    setTimeout(() => document.getElementById("beacon").submit(), 2000);
  </script>
</body>
</html>
