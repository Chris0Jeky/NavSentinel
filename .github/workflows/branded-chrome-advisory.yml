name: Branded Chrome Advisory

# This lane records real Google Chrome behaviour for scheduled/manual runs and
# explicitly labelled same-repository PRs. It complements bundled-Chromium CI.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: branded-chrome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branded-chrome:
    name: Branded Chrome / acceptance
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'gate:browser'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NAVSENTINEL_REALISTIC_CHROME: "1"
      NAVSENTINEL_LIVE: "0"
      NAVSENTINEL_BRANDED_RECORD: test-results/branded-chrome-launches.jsonl
      NAVSENTINEL_ACCEPTANCE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Acceptance procedures verify ancestry of merged fixes.
          # PR evidence must describe the immutable branch head, not GitHub's
          # synthetic refs/pull/<n>/merge commit (#948).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout provenance
        env:
          EXPECTED_CHECKOUT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$EXPECTED_CHECKOUT_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git cat-file -e "$actual_head^{commit}"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24 # Acceptance CDP helper uses the global WebSocket API.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        id: build
        run: npm run build

      - name: Install Playwright browsers and dependencies
        id: browsers
        run: npx playwright install --with-deps chromium

      - name: Record exact browser and artifact
        id: chrome
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          # GitHub's Ubuntu runner image ships Chrome stable; fail if that changes.
          test -x /opt/google/chrome/chrome
          mkdir -p test-results
          chrome_version=$(/opt/google/chrome/chrome --version)
          checkout_head=$(git rev-parse HEAD)
          printf 'checkout_head=%s\nevent_sha=%s\npull_request=%s\npull_request_head=%s\npull_request_base=%s\nrun_id=%s\nrun_attempt=%s\nrunner_image=%s\nchrome=%s\nrealistic=1\n' \
            "$checkout_head" "$GITHUB_SHA" "$PULL_REQUEST_NUMBER" "$PULL_REQUEST_HEAD" "$PULL_REQUEST_BASE" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion" "$chrome_version" > test-results/branded-run.txt
          cat test-results/branded-run.txt

      - name: Record Git reachability before browser run
        run: |
          node scripts/record-git-reachability.mjs --phase before-e2e
          test -s test-results/git-reachability-before-e2e.txt

      - name: Run realistic branded Chrome E2E
        id: e2e
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Preserve the existing smoke -> regression -> phase2 ordering and
          # fail-fast result while recording which project makes the full
          # checkout shallow on pull_request runners (#948).
          for project in smoke regression phase2; do
            status=0
            xvfb-run -a npx playwright test -c playwright.branded.config.ts --project="$project" || status=$?
            retention_status=0
            node scripts/retain-branded-project-evidence.mjs "$project" || retention_status=$?
            node scripts/record-git-reachability.mjs --phase "after-$project"
            test -s "test-results/git-reachability-after-$project.txt"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            if [ "$retention_status" -ne 0 ]; then
              exit "$retention_status"
            fi
          done

      - name: Record Git reachability after browser run
        if: ${{ always() }}
        run: |
          node scripts/record-git-reachability.mjs --phase after-e2e
          test -s test-results/git-reachability-after-e2e.txt

      - name: Run non-live acceptance procedures
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' && steps.chrome.outcome == 'success' }}
        timeout-minutes: 25
        run: xvfb-run -a npm run test:acceptance

      - name: Upload browser receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: branded-chrome-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            artifacts/acceptance/
            artifacts/branded/
          if-no-files-found: warn
          retention-days: 14
