name: Export NavSentinel Source

on:
  push:
    branches:
      - codex/export-pr936-source-20260926

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: a477af9190cd2ace5d2d36dd4a976224d8c3118e
    steps:
      - name: Checkout exact PR 938 head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: a477af9190cd2ace5d2d36dd4a976224d8c3118e
          fetch-depth: 0

      - name: Verify exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Create source archive
        run: git archive --format=zip --output=navsentinel-pr938-a477af9.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: navsentinel-pr938-a477af9
          path: navsentinel-pr938-a477af9.zip
          if-no-files-found: error
          retention-days: 1
