name: Codex apply PR 930 credential boundary

on:
  push:
    branches:
      - codex/js-behavior-defense-20260925
    paths:
      - .github/workflows/codex-apply-pr930.yml
      - .github/codex-pr930-hidden-submit.patch

permissions:
  contents: write

concurrency:
  group: codex-apply-pr930
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: codex/js-behavior-defense-20260925
      - name: Apply reviewed credential-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/codex-pr930-hidden-submit.patch
          git apply .github/codex-pr930-hidden-submit.patch
          rm .github/codex-pr930-hidden-submit.patch .github/workflows/codex-apply-pr930.yml
          git diff --check
          npm ci
          npx vitest run \
            tests/js-behavior-hidden-password-submit.test.ts \
            tests/js-behavior-defense-regressions.test.ts \
            tests/js-behavior-submitter-baseline.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(jsmonitor): count submitted hidden credentials"
          git push origin HEAD:refs/heads/codex/js-behavior-defense-20260925
