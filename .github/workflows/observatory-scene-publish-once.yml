name: Publish exact Observatory scene candidate
on:
  push:
    branches: [feat/observatory-scenes-20260913]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/feat/observatory-scenes-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observatory-scenes-20260913
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          data=''.join(pathlib.Path(f'.observatory-scene-{i}').read_text() for i in range(1,3))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='af6f9e38717fea6f612a4ddda1e95eb7c1235b475b3f4ce1d07a8cd7195128ee'
          pathlib.Path('/tmp/scene.patch').write_bytes(patch)
          PY
          git apply --index /tmp/scene.patch
          git rm .observatory-scene-1 .observatory-scene-2 .github/workflows/observatory-scene-publish-once.yml
          test "$(git write-tree)" = '5f8a31ca00b4db448a2c5b18145f0d802a213403'
          git diff --cached --check
          git config user.name 'NavSentinel Development'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat(observatory): inspect measured geometry and receiver receipts in scene replay'
          git push origin HEAD:refs/heads/feat/observatory-scenes-20260913
          git rev-parse HEAD HEAD^{tree}
