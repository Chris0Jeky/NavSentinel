name: Codex apply issue 933 patch

on:
  push:
    branches:
      - codex/blocked-action-id-authority-20260925
    paths:
      - .github/workflows/codex-apply-issue933.yml
      - .github/codex-issue933.patch

permissions:
  contents: write

concurrency:
  group: codex-apply-issue933
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: codex/blocked-action-id-authority-20260925
      - name: Apply verified security patch atomically
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/codex-issue933.patch
          git apply .github/codex-issue933.patch
          rm .github/codex-issue933.patch .github/workflows/codex-apply-issue933.yml
          git diff --check
          test "$(git hash-object extension/src/content/main_guard.ts)" = "3e32247d19a5931eb4012bba57c9aa75a1f10b1e"
          test "$(git hash-object extension/src/content/main_guard_helpers.ts)" = "7a1b4af5659ef9fe70fb25a0894dd01bbf7abfa3"
          test "$(git hash-object tests/main-guard-helpers.test.ts)" = "3dbf10413d2133f2f8ed5e6137221c24344819b2"
          test "$(git hash-object gym/main-world-blocked-action-id-collision.html)" = "71546f65eedb7fbb5e48755b3a5ae4f76be3ac9f"
          test "$(git hash-object tests/e2e/blocked-action-id-authority.spec.ts)" = "0a2b504359e4dd9aed552421f942b0136c1d9993"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(main_guard): allocate collision-free blocked action IDs"
          git push origin HEAD:refs/heads/codex/blocked-action-id-authority-20260925
