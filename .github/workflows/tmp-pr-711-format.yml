name: Temporary PR 711 formatting publisher

on:
  push:
    branches:
      - fix/686-pending-create-ordering-20260915

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/686-pending-create-ordering-20260915
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Format inserted source
        run: |
          printf '%s' '' | base64 --decode > /tmp/format-pr711.py
          python3 /tmp/format-pr711.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npx vitest run tests/pending-decision-handlers.test.ts tests/pending-navigation-decision.test.ts tests/pending-decision-store.test.ts
          git diff --check
      - name: Publish
        run: |
          rm .github/workflows/tmp-pr-711-format.yml
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add extension/src/content/pending_navigation_decision.ts extension/src/sw/pending_decision_handlers.ts extension/src/sw/pending_decision_store.ts tests/pending-decision-handlers.test.ts tests/pending-navigation-decision.test.ts .github/workflows/tmp-pr-711-format.yml
          git commit -m 'style: normalize pending decision admission patch'
          git push origin HEAD:fix/686-pending-create-ordering-20260915
