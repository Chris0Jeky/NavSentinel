name: Evidence Observatory
on:
  pull_request:
    paths:
      - 'experiments/evidence-observatory/**'
      - 'docs/observability/**'
      - '.github/workflows/evidence-observatory.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/evidence-observatory/**'
      - 'docs/observability/**'
      - '.github/workflows/evidence-observatory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Offline contracts (no dependency installation)
        run: node --test experiments/evidence-observatory/tests/*.test.mjs
      - name: Generate explicitly illustrative preview
        run: node experiments/evidence-observatory/cli.mjs demo --out test-results/observatory-demo
      - name: Install existing locked browser tooling
        run: npm ci --ignore-scripts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Standalone viewer browser smoke (not extension efficacy)
        run: node experiments/evidence-observatory/smoke-browser.mjs
      - name: Recorded child-form viewer (not a new product campaign)
        run: node experiments/evidence-observatory/smoke-forms.mjs
      - name: Recorded document-lifetime viewer (observer tests, not efficacy)
        run: node experiments/evidence-observatory/smoke-documents.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: observatory-illustrative-preview-and-viewer-smoke
          path: |
            test-results/observatory-demo/
            test-results/observatory-viewer-smoke/
            test-results/observatory-form-viewer/
            test-results/observatory-document-viewer/
          retention-days: 7
