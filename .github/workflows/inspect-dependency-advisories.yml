name: Inspect exact lockfile advisories
on:
  push:
    branches: [audit/20261001-dependency-advisories]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/audit/20261001-dependency-advisories'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Record exact dependency findings without package installation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum package.json package-lock.json
          status=0
          npm audit --package-lock-only --ignore-scripts --json > /tmp/ns-audit.json || status=$?
          test "$status" -le 1
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('/tmp/ns-audit.json', 'utf8'));
          if (audit.error || !audit.metadata || !audit.vulnerabilities) throw new Error(JSON.stringify(audit));
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: audit.vulnerabilities }, null, 2));
          JS
          git diff --exit-code -- package.json package-lock.json
