name: Observatory form evidence
on:
  pull_request:
    paths:
      - 'tests/e2e/form_intent_lab.ts'
      - 'tests/e2e/issue688-form-intent.spec.ts'
      - 'tests/e2e/form_observatory*'
      - 'tests/form-observatory*'
      - 'tests/form-document*'
      - 'tests/e2e/form_document*'
      - 'tests/e2e/form-document*'
      - 'experiments/form-observatory/**'
      - 'docs/observability/FORM*'
      - '.github/workflows/observatory-form-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  form-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preserve exact source with evidence
        run: |
          mkdir -p form-evidence
          git rev-parse HEAD HEAD^{tree} > form-evidence/source-identity.txt
          git archive --format=tar.gz HEAD > form-evidence/source.tar.gz
          sha256sum form-evidence/source.tar.gz > form-evidence/source.sha256
      - run: npm ci --ignore-scripts
      - name: Test probe, health, recorder and parity boundaries
        run: |
          npx vitest run tests/form-observatory.test.ts tests/form-observatory-health.test.ts tests/form-document-registry.test.ts tests/form-document-transport.test.ts tests/form-document-recorder.test.ts
          node --test experiments/form-observatory/*.test.mjs
      - run: npm run typecheck && npm run lint
      - id: build
        run: npm run build
      - id: browser
        run: npx playwright install --with-deps chromium
      - name: Actual browser document lifecycle attribution (not prevention)
        run: npx playwright test tests/e2e/form-document-lifecycle.spec.ts --project=regression --workers=1 --retries=0 --output=test-results/form-documents
      - name: Require six durable lifecycle receipts before other reports replace HTML
        run: node -e 'const fs=require("node:fs"); const files=fs.readdirSync("test-results/form-documents",{recursive:true}).filter(p=>p.endsWith("document-lifecycle.form-trace.json")); if(files.length!==6)throw Error("LIFECYCLE_RECEIPTS_MISSING");'
      - name: Existing form assertions with detailed observation
        env:
          NAVSENTINEL_FORM_OBSERVATORY: '1'
        run: npx playwright test tests/e2e/issue688-form-intent.spec.ts --project=regression --workers=2 --fully-parallel --retries=0 --output=test-results/form-full
      - name: Refuse incomplete observation even when product assertions pass
        run: node experiments/form-observatory/check-capture.mjs test-results/form-full | tee form-evidence/capture-check.json
      - name: Same assertions without the detailed observer
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npx playwright test tests/e2e/issue688-form-intent.spec.ts --project=regression --workers=2 --fully-parallel --retries=0 --output=test-results/form-control
      - name: Require all forty-five arm outcomes and complete observer traces
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: node experiments/form-observatory/compare.mjs test-results/form-full test-results/form-control | tee form-evidence/observer-parity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: observatory-form-evidence
          path: |
            form-evidence/
            test-results/form-full/
            test-results/form-control/
            test-results/form-documents/
            playwright-report/
          retention-days: 7
