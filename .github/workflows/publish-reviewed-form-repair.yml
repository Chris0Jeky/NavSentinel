name: Prove and publish reviewed form repair
on:
  push:
    branches: [audit/20261001-defensive-integration]
    paths: [.github/workflows/publish-reviewed-form-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Chris0Jeky/NavSentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAVSENTINEL_REALISTIC_CHROME: '1'
      NAVSENTINEL_BRANDED_RECORD: test-results/replay-launches.jsonl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 457110dd88b82cedd2f1e2b288de6ce7c94f2153
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Correct only the top-navigation receipt observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/form-submit-unmatched-replay.spec.ts')
          s=p.read_text().replace('recorded and aborted to contain the baseline;', 'recorded and answered with no content to contain the baseline;').replace('if (receipt === "escape") await route.abort();','if (receipt === "escape") await route.fulfill({ status: 204, body: "" });')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Require exactly the four security regressions, with all controls passing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          status=0
          xvfb-run -a npx playwright test -c playwright.branded.config.ts tests/e2e/form-submit-unmatched-replay.spec.ts --project=regression --retries=0 --reporter=json > /tmp/replay-red.json || status=$?
          test "$status" = 1
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('/tmp/replay-red.json','utf8'));
          assert.equal(r.stats.expected,4); assert.equal(r.stats.unexpected,4); assert.equal(r.stats.skipped,0); assert.equal(r.stats.flaky,0);
          console.log(JSON.stringify(r.stats));
          function walk(s) { for(const c of s.specs??[]) for(const t of c.tests??[]) if(t.status==='unexpected') { assert.match(c.title,/child-only replay retires unmatched authority/); console.log(c.title); } for(const child of s.suites??[]) walk(child); }
          for(const s of r.suites) walk(s);
          JS
          git restore tests/e2e/form-submit-unmatched-replay.spec.ts
      - name: Apply the reviewed five-file patch and pin the complete result tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          encoded='H4sIAAAAAAAC/9VabXPbxhH+jl9xYToJGQKgSFGyJEdxZMdpNLUSjyxPP2Qy4hE4krBBALkDRLGu/nuf3TuApF6pttOZajySCNzt7cuzu8+eHCeTiQiCaVIK2YvzyPROdDRLShWVlVaXMosvf5KlvPw5zRfhPBbjLRZ5SRara9GXw/7OeDAIw101ONyPX+yI/s7O/nDoBUGw1Wlet9vd7sQffxRBf2ff7w101ODUMMY'
          PY
