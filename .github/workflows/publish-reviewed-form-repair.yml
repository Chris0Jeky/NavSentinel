name: Prove and publish reviewed form repair
on:
  push:
    branches: [audit/20261001-defensive-integration]
    paths: [.github/workflows/publish-reviewed-form-repair.yml]
concurrency:
  group: reviewed-form-repair
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Chris0Jeky/NavSentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAVSENTINEL_REALISTIC_CHROME: '1'
      NAVSENTINEL_BRANDED_RECORD: test-results/replay-launches.jsonl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 457110dd88b82cedd2f1e2b288de6ce7c94f2153
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Correct only the top-navigation receipt observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/form-submit-unmatched-replay.spec.ts')
          s=p.read_text().replace('recorded and aborted to contain the baseline;', 'recorded and answered with no content to contain the baseline;').replace('if (receipt === "escape") await route.abort();','if (receipt === "escape") await route.fulfill({ status: 204, body: "" });')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Require exactly four security failures and four passing controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/form-proof
          git rev-parse HEAD > /tmp/form-proof/red-head.txt
          git diff > /tmp/form-proof/red-observer-only.patch
          status=0
          xvfb-run -a npx playwright test -c playwright.branded.config.ts tests/e2e/form-submit-unmatched-replay.spec.ts --project=regression --retries=0 --reporter=json > /tmp/form-proof/red.json || status=$?
          test "$status" = 1
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('/tmp/form-proof/red.json','utf8'));
          assert.equal(r.stats.expected,4); assert.equal(r.stats.unexpected,4); assert.equal(r.stats.skipped,0); assert.equal(r.stats.flaky,0);
          console.log(JSON.stringify(r.stats));
          function walk(s) { for(const c of s.specs??[]) for(const t of c.tests??[]) if(t.status==='unexpected') { assert.match(c.title,/child-only replay retires unmatched authority/); console.log(c.title); } for(const child of s.suites??[]) walk(child); }
          for(const s of r.suites) walk(s);
          JS
          git restore tests/e2e/form-submit-unmatched-replay.spec.ts
      - name: Apply the exact reviewed patch and attest the result tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,subprocess
          patch=subprocess.check_output(['git','show','6882593ff760df2af18ea6f50dae605e3dfb7e05:.reviewed-form-repair.patch'])
          patch=patch.replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest()=='8c8ac797ee54bf76ce1e80b1597baf185458b3afe3034cdfc5c60294633407b5'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          test "$(git write-tree)" = 4ab28e7ec5e5ed11fb8efba2ac9c05ba5c6d30f8
          git diff --cached --check
          git diff --cached > /tmp/form-proof/repaired.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): retire unrelated live grants before child replay callbacks (#936)'
          git rev-parse HEAD > /tmp/form-proof/green-head.txt
          git rev-parse HEAD^{tree} > /tmp/form-proof/green-tree.txt
      - run: npm run typecheck && npm run lint && npm test
      - name: Verify the repaired browser matrix without retries
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run check:perf-budget
          xvfb-run -a npx playwright test -c playwright.branded.config.ts tests/e2e/form-submit-unmatched-replay.spec.ts tests/e2e/form-submit-child-replay.spec.ts tests/e2e/form-submit-child-authority.spec.ts --project=regression --retries=0 --reporter=json > /tmp/form-proof/green.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('/tmp/form-proof/green.json','utf8'));
          assert.equal(r.stats.expected,14); assert.equal(r.stats.unexpected,0); assert.equal(r.stats.skipped,0); assert.equal(r.stats.flaky,0);
          console.log(JSON.stringify(r.stats));
          JS
          npm run build:research-reputation
          npm run check:perf-budget
      - name: Publish verified repair without rewriting branch history
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 457110dd88b82cedd2f1e2b288de6ce7c94f2153
          test "$(git rev-parse HEAD^{tree})" = 4ab28e7ec5e5ed11fb8efba2ac9c05ba5c6d30f8
          git diff --exit-code
          git push origin HEAD:refs/heads/codex/865-formdata-child-replay-20260925
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: form-repair-proof-${{ github.run_id }}
          path: /tmp/form-proof/
          retention-days: 7
          if-no-files-found: error
