name: Reconcile form replay and prove regression
on:
  push:
    branches: [codex/865-formdata-child-replay-20260925]
    paths: [.github/workflows/reconcile-form-replay.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Chris0Jeky/NavSentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Publish only the locally verified additive merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 555c6ccb021496bb56687620beff1eaf1615c1e0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 5e796e3576803476547aa9846f25e2bc7102a791 || test "$(git diff --name-only --diff-filter=U)" = extension/src/content/main_guard.ts
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('extension/src/content/main_guard.ts')
          s=p.read_text()
          count=0
          def resolve(m):
            global count
            count+=1
            left,right=m.group(1),m.group(2)
            if count==1:
              return '  resolveChildNavigable,\n  resolveFormActionUrl,\n  shouldEmitRapidPushState,\n  type ChildNavigableView,\n  type AnchorOpenIntent,\n'
            if count==2:
              return left[:left.index('function makeId()')]
            if count==3:
              return left+'\n'+right
            raise RuntimeError('Unexpected conflict')
          s=re.sub(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> [^\n]*\n',resolve,s,flags=re.S)
          assert count==3
          p.write_text(s)
          PY
          test "$(git hash-object extension/src/content/main_guard.ts)" = ed92a25a43a93df3f0ee9e8a9f2585fbf1c1f862
          git add extension/src/content/main_guard.ts
          git rm .github/workflows/reconcile-form-replay.yml
          git diff --cached --check
          test "$(git write-tree)" = 1f0c531ea3c58c9234a3e3fccabc2b46e3c28edc
          git commit -m 'test(security): integrate current main and pin unmatched replay authority (#936)'
          git push origin HEAD:refs/heads/codex/865-formdata-child-replay-20260925
          git config --local --unset-all http.https://github.com/.extraheader || true
          mkdir -p test-results
          git rev-parse HEAD > test-results/replay-red-head.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual built-extension replay matrix, no retries
        env:
          NAVSENTINEL_REALISTIC_CHROME: '1'
          NAVSENTINEL_BRANDED_RECORD: test-results/replay-red-launches.jsonl
        run: xvfb-run -a npx playwright test -c playwright.branded.config.ts tests/e2e/form-submit-unmatched-replay.spec.ts tests/e2e/form-submit-child-replay.spec.ts tests/e2e/form-submit-child-authority.spec.ts --project=regression --retries=0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: form-replay-red-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: error
