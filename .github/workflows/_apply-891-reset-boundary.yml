name: Apply #891 reset-boundary repair

on:
  push:
    branches: [fix/891-mode-adaptive-cache-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Apply, verify and self-remove
        env:
          EXPECTED_PARENT: 858d926096d16d949303e85cf2c2caad47005db8
          BASE_MAIN: f01c8fc673664702d3a28940e0ed748a60b525fb
          EXPECTED_SOURCE_BLOB: a82fcc7eca1a3f503114c7fc6d740c0307a1edc2
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/891-mode-adaptive-cache-v2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object extension/src/shared/storage_impl.ts)" = "$EXPECTED_SOURCE_BLOB"

          npm ci
          python - <<'PY'
          from pathlib import Path

          path = Path("extension/src/shared/storage_impl.ts")
          source = path.read_text()

          replacements = [
              (
                  """function updateSuiteSettingsDirect(
            partial: SuiteSettingsPatch,
            expected?: SuiteSettings,
          ): Promise<SuiteSettingsUpdateResponse> {""",
                  """function updateSuiteSettingsDirect(
            partial: SuiteSettingsPatch,
            expected?: SuiteSettings,
            options?: { recomputeAdaptiveScoresOnModeChange?: boolean },
          ): Promise<SuiteSettingsUpdateResponse> {""",
              ),
              (
                  "      if (cur.nav.defaultMode !== merged.nav.defaultMode) {",
                  """      if (
            options?.recomputeAdaptiveScoresOnModeChange !== false &&
            cur.nav.defaultMode !== merged.nav.defaultMode
          ) {""",
              ),
              (
                  "  return updateSuiteSettingsDirect(patch);",
                  """  return updateSuiteSettingsDirect(patch, undefined, {
            // A section reset changes settings only; every behavioural-data lane stays byte-identical (#563).
            recomputeAdaptiveScoresOnModeChange: false,
          });""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement, found {count}: {old.splitlines()[0]}")
              source = source.replace(old, new)

          path.write_text(source)
          PY

          npx vitest run tests/storage-mode-adaptive.test.ts tests/storage-section-reset.test.ts tests/storage-settings-order.test.ts

          rm .github/workflows/_apply-891-reset-boundary.yml tmp/apply-891-reset-boundary.patch
          rmdir tmp
          git diff --check

          expected_final=$'extension/src/shared/storage_impl.ts\ntests/e2e/adaptive-mode-settings.spec.ts\ntests/storage-mode-adaptive.test.ts'
          actual_final=$(git diff --name-only "$BASE_MAIN" | sort)
          test "$actual_final" = "$expected_final"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): preserve adaptive cache on section reset"
          git push origin HEAD:fix/891-mode-adaptive-cache-v2
