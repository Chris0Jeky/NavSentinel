name: Issue 684 Vite-root PostCSS repair

on:
  push:
    branches:
      - fix/684-raw-evidence-inputs-20260916

permissions:
  contents: write

concurrency:
  group: issue-684-vite-root-postcss-repair
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout full authority history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/684-raw-evidence-inputs-20260916

      - name: Set up repository Node floor
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove Vite-root regressions are red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          npx vitest run tests/extension-build-postcss-authority.test.ts \
            > "$RUNNER_TEMP/postcss-vite-root-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/postcss-vite-root-red.log"
          test "$status" -ne 0
          grep -F "rejects an untracked PostCSS config under the Vite project root" \
            "$RUNNER_TEMP/postcss-vite-root-red.log"
          grep -F "rejects a tracked PostCSS rc config under the Vite project root" \
            "$RUNNER_TEMP/postcss-vite-root-red.log"
          grep -F "2 failed" "$RUNNER_TEMP/postcss-vite-root-red.log"

      - name: Materialize clean repair commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/issue684-vite-root-postcss-repair.py
          python - <<'PY'
          from pathlib import Path

          for name in (
              "docs/security-program/RAW_EVIDENCE_AUTHORITY_684.md",
              "docs/security-program/STATE_AUTHORITY_CAMPAIGN.md",
          ):
              target = Path(name)
              target.write_text(
                  target.read_text(encoding="utf-8").rstrip() + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check
          git config user.name "NavSentinel Qualification"
          git config user.email "navsentinel-qualification@example.invalid"
          git add \
            docs/security-program/RAW_EVIDENCE_AUTHORITY_684.md \
            docs/security-program/STATE_AUTHORITY_CAMPAIGN.md \
            tests/e2e/extension_build_provenance.ts
          git rm \
            .github/workflows/issue684-vite-root-postcss-repair.yml \
            scripts/issue684-vite-root-postcss-repair.py
          git diff --cached --check
          git commit -m "fix: reject PostCSS configs under Vite root"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git rev-parse 'HEAD:scripts/run-state-authority-campaign.mjs'

      - name: Lint and typecheck exact head
        run: |
          npm run lint
          npm run typecheck

      - name: Run focused Vite-root PostCSS contracts
        run: npx vitest run tests/extension-build-postcss-authority.test.ts

      - name: Run full unit and contract suite
        run: npm test

      - name: Verify Git object store
        run: git fsck --full --strict --no-reflogs --no-progress HEAD

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run and externally verify exact committed campaign
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          launcher_oid="$(git rev-parse HEAD:scripts/run-state-authority-campaign.mjs)"
          launcher_path="$RUNNER_TEMP/run-state-authority-campaign.mjs"
          git cat-file blob "$launcher_oid" > "$launcher_path"
          chmod 600 "$launcher_path"
          env -u NODE_OPTIONS -u NODE_PATH \
            NAVSENTINEL_EXPECTED_LAUNCHER_OID="$launcher_oid" \
            xvfb-run -a node "$launcher_path" \
              --repository "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/launcher.log"
          summary="$(grep 'committed-launcher-finalization-complete' \
            "$RUNNER_TEMP/launcher.log" | tail -n 1)"
          test -n "$summary"
          printf '%s\n' "$summary" > "$RUNNER_TEMP/launcher-summary.json"
          fingerprint="$(node -e \
            'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(x.signingPublicKeySha256);' \
            "$RUNNER_TEMP/launcher-summary.json")"
          manifest_sha="$(node -e \
            'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(x.manifestSha256);' \
            "$RUNNER_TEMP/launcher-summary.json")"
          node scripts/verify-state-authority-receipts.mjs \
            --directory test-results/state-authority-launcher-receipts \
            --expected-public-key-sha256 "$fingerprint" \
            --expected-manifest-sha256 "$manifest_sha" \
            --expected-repository-head "$(git rev-parse HEAD)" \
            | tee "$RUNNER_TEMP/verifier-summary.json"
          node -e \
            'const fs=require("node:fs");const launch=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const verified=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));if(launch.manifestSha256!==verified.manifestSha256||launch.signingPublicKeySha256!==verified.signingPublicKeySha256||verified.receiptCount!==3)process.exit(1);' \
            "$RUNNER_TEMP/launcher-summary.json" \
            "$RUNNER_TEMP/verifier-summary.json"
          cp "$RUNNER_TEMP/launcher-summary.json" \
            test-results/state-authority-launcher-receipts/launcher-summary.json
          cp "$RUNNER_TEMP/verifier-summary.json" \
            test-results/state-authority-launcher-receipts/verifier-summary.json

      - name: Run ordinary E2E without launcher-only spec
        run: xvfb-run -a npm run test:e2e

      - name: Check performance budgets
        run: node scripts/check-perf-budget.mjs

      - name: Upload final signed receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue-684-vite-root-postcss-signed-receipts
          path: test-results/state-authority-launcher-receipts
          if-no-files-found: error
          retention-days: 30

      - name: Push qualified exact head
        run: git push origin HEAD:fix/684-raw-evidence-inputs-20260916
