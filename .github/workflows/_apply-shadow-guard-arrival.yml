name: Apply shadow guard arrival time

on:
  push:
    branches:
      - fix/bridge-local-clock-authority-20260920

permissions:
  contents: write

concurrency:
  group: apply-shadow-guard-arrival-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/bridge-local-clock-authority-20260920

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm

      - name: Apply receiver-owned shadow correlation
        run: python scripts/_apply_shadow_guard_arrival.py

      - name: Check patch shape
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused clock regressions
        run: >-
          npx vitest run
          tests/shadow-guard-correlation.test.ts
          tests/bridge-clock-authority.test.ts
          tests/pushstate-guard.test.ts
          tests/dblclick-guard.test.ts
          tests/clipboard-bridge.test.ts
          tests/main-world-clock.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Shadow DOM duplicate-prompt regression
        run: >-
          xvfb-run -a npx playwright test
          tests/e2e/evasion.spec.ts
          --project=regression
          --grep "shadow DOM overlay is caught via composedPath"

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make shadow prompt correlation receiver-owned"
          git push origin HEAD:"${GITHUB_REF_NAME}"
