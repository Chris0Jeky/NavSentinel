name: Issue 684 portability and signature repair

on:
  push:
    branches:
      - fix/684-raw-evidence-inputs-20260916

permissions:
  contents: write

concurrency:
  group: issue-684-portability-integrity-repair
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/684-raw-evidence-inputs-20260916

      - name: Set up repository Node floor
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the plain-Node regression is red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          npx vitest run tests/state-authority-launcher-contract.test.ts \
            -t "non-consumable preflight summary" \
            > "$RUNNER_TEMP/node-floor-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/node-floor-red.log"
          test "$status" -ne 0
          grep -E "ERR_UNKNOWN_FILE_EXTENSION|Unknown file extension.*[.]ts" \
            "$RUNNER_TEMP/node-floor-red.log"

      - name: Materialize final repair commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/issue684-repair-script-fix.py
          python scripts/issue684-portability-integrity-repair.py
          node --check scripts/run-state-authority-campaign.mjs
          node --check scripts/verify-state-authority-receipts.mjs
          git diff --check
          git config user.name "NavSentinel Qualification"
          git config user.email "navsentinel-qualification@example.invalid"
          git add \
            docs/security-program/RAW_EVIDENCE_AUTHORITY_684.md \
            docs/security-program/STATE_AUTHORITY_CAMPAIGN.md \
            scripts/run-state-authority-campaign.mjs \
            scripts/verify-state-authority-receipts.mjs \
            tests/state-authority-launcher-contract.test.ts
          git rm \
            .github/workflows/issue684-portability-integrity-repair.yml \
            scripts/issue684-portability-integrity-repair.py \
            scripts/issue684-repair-script-fix.py
          git commit -m "fix: make state-authority evidence portable and verifiable"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Lint and typecheck exact head
        run: |
          npm run lint
          npm run typecheck

      - name: Run full unit suite at Node floor
        run: npm test

      - name: Verify Git object store
        run: git fsck --full --strict --no-reflogs --no-progress HEAD

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run and externally verify exact committed campaign
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          launcher_oid="$(git rev-parse HEAD:scripts/run-state-authority-campaign.mjs)"
          launcher_path="$RUNNER_TEMP/run-state-authority-campaign.mjs"
          git cat-file blob "$launcher_oid" > "$launcher_path"
          chmod 600 "$launcher_path"
          env -u NODE_OPTIONS -u NODE_PATH \
            NAVSENTINEL_EXPECTED_LAUNCHER_OID="$launcher_oid" \
            xvfb-run -a node "$launcher_path" \
              --repository "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/launcher.log"
          summary="$(grep 'committed-launcher-finalization-complete' \
            "$RUNNER_TEMP/launcher.log" | tail -n 1)"
          test -n "$summary"
          printf '%s\n' "$summary" > "$RUNNER_TEMP/launcher-summary.json"
          fingerprint="$(node -e \
            'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(x.signingPublicKeySha256);' \
            "$RUNNER_TEMP/launcher-summary.json")"
          node scripts/verify-state-authority-receipts.mjs \
            --directory test-results/state-authority-launcher-receipts \
            --expected-public-key-sha256 "$fingerprint" \
            --expected-repository-head "$(git rev-parse HEAD)" \
            | tee "$RUNNER_TEMP/verifier-summary.json"
          node -e \
            'const fs=require("node:fs");const launch=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const verified=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));if(launch.manifestSha256!==verified.manifestSha256||launch.signingPublicKeySha256!==verified.signingPublicKeySha256||verified.receiptCount!==3)process.exit(1);' \
            "$RUNNER_TEMP/launcher-summary.json" \
            "$RUNNER_TEMP/verifier-summary.json"
          node scripts/check-perf-budget.mjs

      - name: Upload launcher-signed receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue-684-launcher-signed-receipts
          path: test-results/state-authority-launcher-receipts
          if-no-files-found: error
          retention-days: 30

      - name: Push qualified exact head
        run: git push origin HEAD:fix/684-raw-evidence-inputs-20260916
