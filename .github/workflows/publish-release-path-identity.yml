name: Materialize reviewed path-identity patch
on:
  push:
    branches: [audit/publish-release-path-identity-20261001]
    paths: [.github/workflows/publish-release-path-identity.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'Chris0Jeky/NavSentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed bytes and publish only the staging branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/release-input-integrity.mjs)" = 56f534d182a7f895e1167f0cc49b0d35d05faa54
          test "$(git rev-parse HEAD:tests/release-input-integrity.test.ts)" = d25f059fd11428ed88b2f1f438a83a28e2d9d96d
          echo 'b1bbdee2b9f820908c2144bf02ff5612d908b68ad2b4d3f71e65863bf0623c1f  .github/release-path-identity.patch' | sha256sum --check --strict
          git apply --check .github/release-path-identity.patch
          git apply .github/release-path-identity.patch
          git rm .github/release-path-identity.patch .github/workflows/publish-release-path-identity.yml
          git add scripts/release-input-integrity.mjs tests/release-input-integrity.test.ts
          git diff --cached --check
          test "$(git write-tree)" = 0c8e42a9ac9576329f7a25e8b7b6daa34ab3c956
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): preserve exact UTF-8 path identities (#988)'
          git push origin HEAD:refs/heads/audit/publish-release-path-identity-20261001
          git rev-parse HEAD HEAD^{tree}
