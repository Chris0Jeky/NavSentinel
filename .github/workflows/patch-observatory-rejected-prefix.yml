name: Patch Observatory rejected prefix

on:
  push:
    branches:
      - feat/observatory-form-inspector-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cursor-scoped rejected-spend repair
        shell: python
        run: |
          from pathlib import Path

          state = Path('experiments/evidence-observatory/form-state.mjs')
          text = state.read_text(encoding='utf-8')
          addition = '\n\n' + '\n'.join([
              'export function countRejectedReceiverAttempts(c, cursor) {',
              "  if (!Array.isArray(c?.events) || !Number.isInteger(cursor) || cursor < 0 || cursor >= c.events.length) return 0;",
              "  return c.events.slice(0, cursor + 1).filter(event => event?.kind === 'receiver.rejected').length;",
              '}',
          ]) + '\n'
          if 'export function countRejectedReceiverAttempts' in text:
              raise SystemExit('helper already present')
          state.write_text(text.rstrip() + addition, encoding='utf-8')

          tests = Path('experiments/evidence-observatory/tests/form-state.test.mjs')
          text = tests.read_text(encoding='utf-8')
          old = "import { selectFormIntent } from '../form-state.mjs';"
          new = "import { countRejectedReceiverAttempts, selectFormIntent } from '../form-state.mjs';"
          if text.count(old) != 1:
              raise SystemExit(f'expected one form-state import, found {text.count(old)}')
          text = text.replace(old, new)
          text += '\n' + '\n'.join([
              "test('rejected receiver spends appear only after their event enters the visible prefix', () => {",
              "  const c = { events: [event('run.start', 'runner'), event('receiver.rejected', 'sink'), event('observation.end', 'runner')] };",
              '  assert.equal(countRejectedReceiverAttempts(c, 0), 0);',
              '  assert.equal(countRejectedReceiverAttempts(c, 1), 1);',
              '  assert.equal(countRejectedReceiverAttempts(c, 2), 1);',
              '});',
          ]) + '\n'
          tests.write_text(text, encoding='utf-8')

          render = Path('experiments/evidence-observatory/render.mjs')
          text = render.read_text(encoding='utf-8')
          replacements = [
              ("import { selectFormIntent } from './form-state.mjs';", "import { countRejectedReceiverAttempts, selectFormIntent } from './form-state.mjs';"),
              ("    panel.append(make('p', `Rejected receiver spends: ${c.formEvidence.rejectedAttempts}. A receiver rejection is not a NavSentinel block.`, 'muted'));", "    const rejectedAttempts = countRejectedReceiverAttempts(c, cursor);\n    panel.append(make('p', `Rejected receiver spends at or before selected event: ${rejectedAttempts}. A receiver rejection is not a NavSentinel block.`, 'muted'));"),
              ("  const script = `${selectScene.toString()}\\n${selectFormIntent.toString()}\\n(${application.toString()})();`;", "  const script = `${selectScene.toString()}\\n${selectFormIntent.toString()}\\n${countRejectedReceiverAttempts.toString()}\\n(${application.toString()})();`;"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one render target, found {text.count(old)}: {old[:60]}')
              text = text.replace(old, new)
          render.write_text(text, encoding='utf-8')

          smoke = Path('experiments/evidence-observatory/smoke-forms.mjs')
          text = smoke.read_text(encoding='utf-8')
          old = "    assert.equal(await page.locator('.receipt-link').count(), 0, 'no future receiver arrival at run start');"
          new = old + "\n    assert.match(await page.locator('#form-panel').innerText(), /Rejected receiver spends at or before selected event: 0/, 'no future rejected spend at run start');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one initial smoke target, found {text.count(old)}')
          text = text.replace(old, new)
          old = "  assert.match(await page.locator('#form-panel').innerText(), /Rejected receiver spends: 1/);"
          new = "  assert.match(await page.locator('#form-panel').innerText(), /Rejected receiver spends at or before selected event: 1/);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one replay smoke target, found {text.count(old)}')
          smoke.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/patch-observatory-rejected-prefix.yml').unlink()

      - name: Run focused contract
        run: node --test experiments/evidence-observatory/tests/form-state.test.mjs

      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/evidence-observatory/form-state.mjs \
            experiments/evidence-observatory/tests/form-state.test.mjs \
            experiments/evidence-observatory/render.mjs \
            experiments/evidence-observatory/smoke-forms.mjs \
            .github/workflows/patch-observatory-rejected-prefix.yml
          git commit -m "fix(observatory): scope rejected spends to the scrubber"
          git push origin "HEAD:${GITHUB_REF_NAME}"
