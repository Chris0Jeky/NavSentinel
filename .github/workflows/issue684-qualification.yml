name: Issue 684 raw evidence qualification

on:
  push:
    branches:
      - fix/684-raw-evidence-inputs-20260916

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: fix/684-raw-evidence-inputs-20260916

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Materialize exact-head candidate
        shell: bash
        run: |
          python scripts/issue684-lint-fixes.py
          python scripts/issue684-wire-campaign.py
          git config user.name "NavSentinel Qualification"
          git config user.email "navsentinel-qualification@example.invalid"
          git add \
            tests/e2e/extension_build_provenance.ts \
            tests/e2e/state-authority-sink.spec.ts \
            docs/security-program/STATE_AUTHORITY_CAMPAIGN.md \
            docs/security-program/RAW_EVIDENCE_AUTHORITY_684.md
          git rm \
            .github/workflows/issue684-qualification.yml \
            scripts/issue684-lint-fixes.py \
            scripts/issue684-wire-campaign.py
          git diff --cached --check
          git commit -m "test: bind state-authority receipts to raw inputs"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - name: Install dependencies
        run: npm ci

      - name: Focused lint
        run: npx eslint tests/e2e/extension_build_provenance.ts tests/e2e/state-authority-sink.spec.ts tests/extension-build-provenance.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Raw authority unit tests
        run: npm run test -- --run tests/extension-build-provenance.test.ts

      - name: Install bundled Chromium
        run: npx playwright install --with-deps chromium

      - name: Typed-harm state-authority campaign
        run: xvfb-run -a npm run test:e2e:stress -- --grep "independent harm oracle"

      - name: Publish qualified candidate
        shell: bash
        run: git push origin HEAD:fix/684-raw-evidence-inputs-20260916
