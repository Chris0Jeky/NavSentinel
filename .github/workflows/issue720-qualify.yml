name: Issue 720 declared-outcome qualification

on:
  push:
    branches:
      - fix/720-invalid-declared-outcome-20260917

permissions:
  contents: write

concurrency:
  group: issue-720-declared-outcome
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/720-invalid-declared-outcome-20260917

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Prove the regression is red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          node --test experiments/evidence-observatory/tests/declared-outcome.test.mjs \
            > "$RUNNER_TEMP/issue720-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/issue720-red.log"
          test "$status" -ne 0
          grep -Fq "rejects a present noncanonical declared outcome" \
            "$RUNNER_TEMP/issue720-red.log"

      - name: Apply the bounded parser correction
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("experiments/evidence-observatory/model.mjs")
          text = target.read_text(encoding="utf-8")
          old = "    c.declaredOutcome = enumValue(run.declaredOutcome, OUTCOMES) ?? 'UNKNOWN';"
          new = """    c.declaredOutcome = run.declaredOutcome === undefined
                ? 'UNKNOWN'
                : requireValue(enumValue(run.declaredOutcome, OUTCOMES), 'DECLARED_OUTCOME_INVALID');"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one declared-outcome projection, found {count}")
          target.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused and complete Observatory contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          node --test experiments/evidence-observatory/tests/declared-outcome.test.mjs
          node --test experiments/evidence-observatory/tests/*.test.mjs
          npx eslint \
            experiments/evidence-observatory/model.mjs \
            experiments/evidence-observatory/tests/declared-outcome.test.mjs

      - name: Publish the qualified repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name "NavSentinel Qualification"
          git config user.email "navsentinel-qualification@example.invalid"
          git add \
            experiments/evidence-observatory/model.mjs \
            experiments/evidence-observatory/tests/declared-outcome.test.mjs
          git rm .github/workflows/issue720-qualify.yml
          git diff --cached --check
          git commit -m "fix(observatory): reject malformed declared outcomes"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/720-invalid-declared-outcome-20260917
