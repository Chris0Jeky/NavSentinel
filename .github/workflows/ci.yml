name: Apply PR 936 Fix

on:
  push:
    branches:
      - codex/apply-pr936-fix-20260925

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 99a162cd41750454287bdb8fac286b1755395945
      TARGET_BRANCH: codex/865-formdata-child-replay-20260925
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 99a162cd41750454287bdb8fac286b1755395945
          fetch-depth: 0

      - name: Verify and apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          cat > /tmp/pr936.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/pr936.patch.gz.b64 | gzip --decompress > /tmp/pr936.patch
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git am /tmp/pr936.patch
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          test "$(git hash-object extension/src/content/main_guard.ts)" = "77fd4cf5743ad00dcb2c34ce4978e5395bc25b6b"
          test "$(git hash-object extension/src/content/main_guard_helpers.ts)" = "1d9eb52711b5ce209193eeca721e6bc3e9d6fd20"
          test "$(git hash-object gym/form-submit-child-replay.html)" = "8d8c0f1c3094e8788d091a243b94135b3427034d"
          test "$(git hash-object tests/e2e/form-submit-child-replay.spec.ts)" = "f307190587f07de8b6596de5889a6b0cec4eb6c8"
          test "$(git hash-object tests/form-child-replay-helpers.test.ts)" = "e3807599856a4012e104ed61ceabfb4eacefd3ea"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
