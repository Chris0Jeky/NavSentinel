name: Happy DOM audit finalizer

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'audit/happy-dom-native-retention'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Materialize and verify final audit changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/clickfix-detector.test.ts')
          text = test_path.read_text()
          old_import = 'import { describe, expect, it, beforeEach } from "vitest";'
          new_import = 'import { afterEach, beforeEach, describe, expect, it } from "vitest";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('unexpected Vitest import')

          start = text.index('describe("hasLegitCaptcha", () => {')
          end_marker = '\n});\n\n// --- #206: a spoofed captcha iframe'
          end = text.index(end_marker, start) + len('\n});')
          section = text[start:end]
          if 'const mount = (html = "")' not in section:
              lines = section.splitlines(keepends=True)
              converted = []
              index = 0
              count = 0
              marker = ' = document.createElement("div");'
              while index < len(lines):
                  line = lines[index]
                  stripped = line.strip()
                  if stripped.startswith('const ') and stripped.endswith(marker):
                      indent = line[:len(line) - len(line.lstrip())]
                      name = stripped[len('const '):-len(marker)]
                      next_line = lines[index + 1] if index + 1 < len(lines) else ''
                      prefix = f'{name}.innerHTML = '
                      if next_line.strip().startswith(prefix) and next_line.strip().endswith(';'):
                          value = next_line.strip()[len(prefix):-1]
                          converted.append(f'{indent}const {name} = mount({value});\n')
                          index += 2
                      else:
                          converted.append(f'{indent}const {name} = mount();\n')
                          index += 1
                      count += 1
                      continue
                  converted.append(line)
                  index += 1
              if count != 15:
                  raise SystemExit(f'unexpected mounted fixture count: {count}')
              section = ''.join(converted)
              intro = '''describe("hasLegitCaptcha", () => {
            const mount = (html = ""): HTMLDivElement => {
              const root = document.body.appendChild(document.createElement("div"));
              root.innerHTML = html;
              return root;
            };

            afterEach(() => {
              document.body.replaceChildren();
            });

            it("does not treat a detached provider iframe as rendered", () => {
              const div = document.createElement("div");
              div.innerHTML = '<iframe src="https://www.google.com/recaptcha/api2/anchor"></iframe>';
              expect(hasLegitCaptcha(div)).toBe(false);
            });

          '''
              section = intro + section[len('describe("hasLegitCaptcha", () => {\n'):]
              text = text[:start] + section + text[end:]
          test_path.write_text(text)

          vitest_path = Path('vitest.config.ts')
          text = vitest_path.read_text()
          setup = '    setupFiles: ["tests/helpers/happy-dom-mutation-observer-retention-setup.mjs"],\n'
          if setup in text:
              text = text.replace(setup, '', 1)
          elif 'happy-dom-mutation-observer-retention-setup' in text:
              raise SystemExit('unexpected Vitest setup shape')
          vitest_path.write_text(text)

          for path in [
              Path('tests/helpers/happy-dom-mutation-observer-retention.mjs'),
              Path('tests/helpers/happy-dom-mutation-observer-retention-setup.mjs'),
          ]:
              path.unlink(missing_ok=True)
          PY

          npm install --package-lock-only --ignore-scripts
          npm ci
          npx vitest run tests/happy-dom-mutation-observer-gc.test.ts tests/clickfix-detector.test.ts
          npx eslint tests/happy-dom-mutation-observer-gc.test.ts tests/clickfix-detector.test.ts
          git diff --check

          git config user.name "NavSentinel Audit"
          git config user.email "59696583+Chris0Jeky@users.noreply.github.com"
          git add package-lock.json tests/clickfix-detector.test.ts vitest.config.ts
          git add -u tests/helpers
          if ! git diff --cached --quiet; then
            git commit -m "test: use native Happy DOM observer retention"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
