name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-unit:
    name: Build / Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify versions
        run: npm run verify:versions

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Check top-sites generated data
        run: npm run check:topsites

      - name: Build bloom filter (test data)
        run: npm run build:bloom:test

      - name: Check bloom filter size (2 MB cap)
        run: npm run check:bloom-size

      - name: Build extension
        run: npm run build

      - name: Check performance budget
        run: npm run check:perf-budget

      - name: Package extension
        run: npm run package:ext

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: navsentinel-extension
          path: artifacts/*.zip
          if-no-files-found: error

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify versions
        run: npm run verify:versions

      - name: Build extension
        run: npm run build

      - name: Check performance budget
        run: npm run check:perf-budget

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag must point to a commit on main"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run verify:versions
      - run: npm run build
      - run: npm run check:perf-budget

      - name: Package extension
        run: npm run package:ext

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: artifacts/*.zip
          generate_release_notes: true
