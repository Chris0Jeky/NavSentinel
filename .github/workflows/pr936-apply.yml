name: Apply PR 936 authority fix

on:
  push:
    branches:
      - codex/865-formdata-child-replay-20260925
    paths:
      - .github/agent-patches/pr936-authority-fix.patch
      - .github/workflows/pr936-apply.yml

permissions:
  contents: write

concurrency:
  group: pr936-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and verify authority fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-patches/pr936-authority-fix.patch
          git apply .github/agent-patches/pr936-authority-fix.patch
          git diff --check

      - name: Commit implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent-patches/pr936-authority-fix.patch
          rm .github/workflows/pr936-apply.yml
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(main_guard): bind child replay authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
