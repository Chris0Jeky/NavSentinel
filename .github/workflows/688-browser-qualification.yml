name: Issue 688 extension-capable browser qualification
on:
  push:
    branches: [fix/688-effective-form-authority-20260913]
    paths: [.github/workflows/688-browser-qualification.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select full Chromium rather than headless shell
        id: commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/688-effective-form-authority-20260913
          test "$(git hash-object tests/e2e/issue688-form-intent.spec.ts)" = e186849c95aae3b7fb56962ad9447639005ff8e3
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/issue688-form-intent.spec.ts')
          s = p.read_text()
          assert s.count('    headless: true,') == 1
          p.write_text(s.replace('    headless: true,', '    headless: true, channel: "chromium",'))
          PY
          git rm .github/workflows/688-browser-qualification.yml
          git add tests/e2e/issue688-form-intent.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: use extension-capable Chromium for child-form qualification'
          git push origin HEAD:refs/heads/fix/688-effective-form-authority-20260913
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exact-head campaign (bounded, no retry-based passing)
        run: npx playwright test tests/e2e/issue688-form-intent.spec.ts --project=regression --workers=2 --fully-parallel --retries=0 --max-failures=5
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue688-full-chromium-campaign
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: warn
