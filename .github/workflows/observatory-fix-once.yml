name: Apply exact Observatory lint fix
on:
  push:
    branches: [feat/observatory-campaign-20260913]
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/feat/observatory-campaign-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observatory-campaign-20260913
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/observatory-overlay.spec.ts')
          text=p.read_text()
          old='let after = start.source, artifactAfter = start.artifact, rawVerified = true;'
          assert text.count(old)==1
          p.write_text(text.replace(old,'let after = start.source, artifactAfter = start.artifact;\n      let rawVerified: boolean;'))
          PY
          git add tests/e2e/observatory-overlay.spec.ts
          git rm .github/workflows/observatory-fix-once.yml
          test "$(git write-tree)" = '5f2f2f807bb23b584bc838b5c30dab1582fa4a89'
          git diff --cached --check
          git config user.name 'NavSentinel Development'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(observability): remove unused initialization and retain early failure report'
          git push origin HEAD:refs/heads/feat/observatory-campaign-20260913
          git rev-parse HEAD HEAD^{tree}
