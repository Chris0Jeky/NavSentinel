name: Apply PR 938 telemetry implementation

on:
  push:
    branches:
      - codex/812-form-mutation-telemetry-20260925
    paths:
      - .github/agent-patches/pr938-implementation.patch
      - .github/workflows/pr938-apply.yml

permissions:
  contents: write

concurrency:
  group: pr938-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and verify implementation patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-patches/pr938-implementation.patch
          git apply .github/agent-patches/pr938-implementation.patch
          git diff --check

      - name: Commit implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent-patches/pr938-implementation.patch
          rm .github/workflows/pr938-apply.yml
          rmdir .github/agent-patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(telemetry): preserve form authority transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
