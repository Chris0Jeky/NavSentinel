name: One-off browser host boundary repair

on:
  push:
    branches: [fix/export-privacy-boundaries-20260912]
    paths: [.github/workflows/oneoff-browser-host-boundary-20260915.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/fix/export-privacy-boundaries-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Apply the fail-closed browser-host repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          old_storage = (
              "  try {\n"
              "    const canonical = normalizeHost(new URL(`https://${normalized}/`).hostname);\n"
              "    if (isIPAddress(canonical)) return canonical;\n"
              "  } catch {\n"
              "    // The value already passed hostname grammar. This probe is IPv4-only.\n"
              "  }\n"
              "  return normalized;\n"
          )
          new_storage = (
              "  try {\n"
              "    const canonical = normalizeHost(new URL(`https://${normalized}/`).hostname);\n"
              "    if (isIPAddress(canonical)) return canonical;\n"
              "    return normalized;\n"
              "  } catch {\n"
              "    // Lexically hostname-shaped values rejected by WHATWG parsing cannot\n"
              "    // be authoritative web page hosts, so omit them rather than guessing.\n"
              "    return undefined;\n"
              "  }\n"
          )
          replace_once("extension/src/shared/storage.ts", old_storage, new_storage)

          old_consumer = (
              "  let parsed;\n"
              "  try{parsed=new URL('https://'+value+'/').hostname;}\n"
              "  catch{if(/^\\d+(?:\\.\\d+){3}$/.test(value))return invalid();return value;}\n"
              "  if(/^\\d+(?:\\.\\d+){3}$/.test(parsed)&&parsed!==value)return invalid();\n"
              "  return value;\n"
          )
          new_consumer = (
              "  let parsed;\n"
              "  try{parsed=new URL('https://'+value+'/').hostname;}\n"
              "  catch{return invalid();}\n"
              "  if(/^\\d+(?:\\.\\d+){3}$/.test(parsed)&&parsed!==value)return invalid();\n"
              "  return value;\n"
          )
          replace_once("experiments/vision-lab/shared/evidence.js", old_consumer, new_consumer)

          old_docs = (
              "Short, integer and hexadecimal WHATWG IPv4 spellings are canonicalized by the\n"
              "extension and rejected on imported evidence unless already dotted-decimal. IPv6\n"
              "is serialized without brackets, matching the stored hostname contract. The\n"
          )
          new_docs = (
              "Short, integer and hexadecimal WHATWG IPv4 spellings are canonicalized by the\n"
              "extension and rejected on imported evidence unless already dotted-decimal.\n"
              "Lexically hostname-shaped values that browser parsing rejects, including\n"
              "overflow and numeric-final forms, are omitted by the extension and rejected on\n"
              "import. IPv6 is serialized without brackets, matching the stored hostname\n"
              "contract. The\n"
          )
          replace_once("docs/vision-overhaul/EVIDENCE_EXPORT_BOUNDARIES.md", old_docs, new_docs)
          PY
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Verify focused extension and portable-consumer contracts
        run: |
          set -euo pipefail
          npx vitest run tests/evidence-boundaries.test.ts tests/storage-export-privacy.test.ts
          npm run vision:test
      - name: Regenerate hash-pinned standalone previews
        run: npm run vision:build
      - name: Publish only the verified repair and generated previews
        run: |
          set -euo pipefail
          git diff --check
          git add -- \
            extension/src/shared/storage.ts \
            experiments/vision-lab/shared/evidence.js \
            experiments/vision-lab/NavSentinel-Browser.html \
            experiments/vision-lab/NavSentinel-Desktop.html \
            experiments/vision-lab/NavSentinel-Intent-Relay.html \
            docs/vision-overhaul/EVIDENCE_EXPORT_BOUNDARIES.md
          git rm -- .github/workflows/oneoff-browser-host-boundary-20260915.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reject browser-invalid evidence hosts'
          git push origin HEAD:refs/heads/fix/export-privacy-boundaries-20260912
