name: Codex apply clean issue 933 reconstruction

on:
  push:
    branches:
      - codex/blocked-action-id-authority-20260925
    paths:
      - .github/codex-issue933-rebuild.patch
      - .github/workflows/codex-apply-issue933-rebuild.yml

permissions:
  contents: write

concurrency:
  group: codex-apply-issue933-rebuild
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: codex/blocked-action-id-authority-20260925

      - name: Apply the reviewed five-file security patch atomically
        shell: bash
        env:
          BASE_SHA: ec078b3754d2396baf2b9494e6acfca62805b141
          BRANCH_NAME: codex/blocked-action-id-authority-20260925
        run: |
          set -euo pipefail

          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t staged_paths < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          expected_staging=(
            .github/codex-issue933-rebuild.patch
            .github/workflows/codex-apply-issue933-rebuild.yml
          )
          diff -u \
            <(printf '%s\n' "${expected_staging[@]}" | sort) \
            <(printf '%s\n' "${staged_paths[@]}" | sort)

          git apply --check .github/codex-issue933-rebuild.patch
          git apply .github/codex-issue933-rebuild.patch
          rm \
            .github/codex-issue933-rebuild.patch \
            .github/workflows/codex-apply-issue933-rebuild.yml

          test "$(git hash-object extension/src/content/main_guard.ts)" = \
            "5d8936bf5eb2dd9b981e17c359707e2d423c5ff1"
          test "$(git hash-object extension/src/content/main_guard_helpers.ts)" = \
            "6ceffe5217aa82ff74b7c1c1b100ff44ccf955d4"
          test "$(git hash-object gym/main-world-blocked-action-id-collision.html)" = \
            "71546f65eedb7fbb5e48755b3a5ae4f76be3ac9f"
          test "$(git hash-object tests/e2e/blocked-action-id-authority.spec.ts)" = \
            "8623bbff7e95168a659f550f93a5ba0e4bc93451"
          test "$(git hash-object tests/main-guard-helpers.test.ts)" = \
            "eb75a1af03ded7df2cae7f0a37848b0df8058ba3"

          git add -A
          git diff --cached --check
          mapfile -t changed_paths < <(git diff --cached --name-only "$BASE_SHA" | sort)
          expected_paths=(
            extension/src/content/main_guard.ts
            extension/src/content/main_guard_helpers.ts
            gym/main-world-blocked-action-id-collision.html
            tests/e2e/blocked-action-id-authority.spec.ts
            tests/main-guard-helpers.test.ts
          )
          diff -u \
            <(printf '%s\n' "${expected_paths[@]}" | sort) \
            <(printf '%s\n' "${changed_paths[@]}" | sort)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(main_guard): allocate collision-free blocked action IDs (#933)"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
