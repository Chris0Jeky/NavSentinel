name: Publish exact cooldown broker patch
on:
  push:
    branches: [fix/976-worker-cooldowns]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/fix/976-worker-cooldowns'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply only verified source bytes and remove publication scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          expected = {
              'extension/src/shared/smart_defaults.ts': ('e7eb9f975449eb77e5126137400237ae66bb642a', '36dd4a23b96c0d169f3e2d0164b6f6cc7dfddf94'),
              'extension/src/sw/sw.ts': ('63a3caace3042bd105cf3680da4e7893ed0194c7', '1e297edeb840dd772cb15c20dedb52b0118f438c'),
          }
          def digest(name):
              data = pathlib.Path(name).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, (before, after) in expected.items():
              assert digest(name) == before, ('preimage', name, digest(name))
          subprocess.run(['git', 'apply', '--check', 'scripts/.cooldown-publication.patch'], check=True)
          subprocess.run(['git', 'apply', 'scripts/.cooldown-publication.patch'], check=True)
          for name, (before, after) in expected.items():
              assert digest(name) == after, ('postimage', name, digest(name))
              print(name, after)
          PY
          git diff --check
          git add extension/src/shared/smart_defaults.ts extension/src/sw/sw.ts
          git rm scripts/.cooldown-publication.patch .github/workflows/publish-cooldown-broker.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(storage): serialize cooldown mutations in the worker (#976)'
          git push origin HEAD:refs/heads/fix/976-worker-cooldowns
