name: Finalize strict object mode verification
on:
  push:
    branches: [fix/release-object-identity-20261001]
    paths: [.github/workflows/finalize-object-mode.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/fix/release-object-identity-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed two-file delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f8e198bda02b9066e45fc990aacd86fbcafb4b1c
          test "$(git hash-object --no-filters scripts/release-input-integrity.mjs)" = f868f6365e276b7c0652886542fdfd0755ba0f5c
          test "$(git hash-object --no-filters tests/release-object-identity.test.ts)" = 3c294d2fab4cc0c95f24dc5adeafd966280c8749
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/release-input-integrity.mjs')
          text = source.read_text()
          old = 'const mode = body.subarray(offset, space).toString("ascii");'
          assert text.count(old) == 1
          source.write_text(text.replace(old, 'const mode = body.subarray(offset, space).toString("utf8");'))
          tests = Path('tests/release-object-identity.test.ts')
          text = tests.read_text()
          marker = '  it("rejects a substituted blob even when raw worktree bytes match it", () => {'
          addition = '''  it("rejects a hash-valid tree whose non-ASCII mode resembles a supported mode", () => {
              const root = repository(format);
              const rawTree = git(root, ["cat-file", "tree", "HEAD^{tree}"]);
              rawTree[0] |= 0x80;
              const tree = git(root, ["hash-object", "--literally", "-w", "-t", "tree", "--stdin"], rawTree).toString().trim();
              const commitBody = git(root, ["cat-file", "commit", "HEAD"]).toString().replace(/^tree [0-9a-f]+/u, `tree ${tree}`);
              const commit = git(root, ["hash-object", "-w", "-t", "commit", "--stdin"], Buffer.from(commitBody)).toString().trim();
              git(root, ["update-ref", "refs/heads/main", commit]);
              expect(() => assertExactCommittedInputs(root)).toThrow(/unsupported tracked mode|malformed tree/i);
            });

          '''
          assert text.count(marker) == 1
          tests.write_text(text.replace(marker, addition + marker))
          PY
          git add scripts/release-input-integrity.mjs tests/release-object-identity.test.ts
          git rm .github/workflows/finalize-object-mode.yml
          git diff --cached --check
          test "$(git write-tree)" = ead0d5f964017f041992adc280bb4295be79cb83
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): reject non-ASCII tree modes without lossy decoding'
          git push origin HEAD:refs/heads/fix/release-object-identity-20261001
