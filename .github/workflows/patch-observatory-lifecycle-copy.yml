name: Patch Observatory lifecycle copy

on:
  push:
    branches:
      - feat/observatory-document-inspector-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply lifecycle-specific reader copy
        shell: python
        run: |
          from pathlib import Path

          render = Path('experiments/evidence-observatory/render.mjs')
          text = render.read_text(encoding='utf-8')
          old = "    panel.append(make('h3', 'Form intent snapshots'), make('p', 'Compare the clicked form/submitter with the later reported operation. These are fixture reports, not proof that the browser executed the requested intent.', 'muted'));"
          new = """    const lifecycleExercise = c.formEvidence.experiment && c.formEvidence.experiment !== 'form-campaign';
    const formIntroduction = lifecycleExercise
      ? 'Compare earlier and selected snapshots reported during this observer lifecycle exercise. No clicked input or native initiator is established.'
      : 'Compare the clicked form/submitter with the later reported operation. These are fixture reports, not proof that the browser executed the requested intent.';
    panel.append(make('h3', 'Form intent snapshots'), make('p', formIntroduction, 'muted'));"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one form introduction, found {text.count(old)}')
          text = text.replace(old, new)

          old = "        const attribution = make('p', `${current.binding.documentId} / ${current.binding.frameId}: ${initial ? 'input and selected report belong to the same reporting document' : 'No reported input for this reporting document'}. This is temporal association, not native causality.`, 'notice');"
          new = """        const associationText = lifecycleExercise
          ? `${initial ? 'Earlier and selected reports belong to the same reporting document' : 'No earlier reported snapshot for this reporting document'}. This is reporting-document association, not interaction or native causality.`
          : `${initial ? 'Input and selected report belong to the same reporting document' : 'No reported input for this reporting document'}. This is temporal association, not native causality.`;
        const attribution = make('p', `${current.binding.documentId} / ${current.binding.frameId}: ${associationText}`, 'notice');"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one attribution line, found {text.count(old)}')
          text = text.replace(old, new)

          old = "      const header = make('tr'); for (const label of ['Field', 'Earlier snapshot', 'Selected snapshot']) header.append(make('th', label)); table.append(header);"
          new = """      const labels = lifecycleExercise
        ? ['Field', 'Earlier reported snapshot', 'Selected reported snapshot']
        : ['Field', 'Earlier snapshot', 'Selected snapshot'];
      const header = make('tr'); for (const label of labels) header.append(make('th', label)); table.append(header);"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one table header, found {text.count(old)}')
          render.write_text(text.replace(old, new), encoding='utf-8')

          smoke = Path('experiments/evidence-observatory/smoke-documents.mjs')
          text = smoke.read_text(encoding='utf-8')
          old = "  assert.deepEqual(await page.locator('[data-field=\"action\"] td').allTextContents(),['benign','harm']);"
          new = old + "\n  assert.match(await page.locator('#form-panel').innerText(),/Compare the clicked form\\/submitter/);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one campaign smoke target, found {text.count(old)}')
          text = text.replace(old, new)

          old = "    assert.deepEqual(await page.locator('[data-field=\"action\"] td').allTextContents(),['Not recorded','benign']);"
          new = old + "\n    assert.match(await page.locator('#form-panel').innerText(),/No clicked input or native initiator is established/);\n    assert.doesNotMatch(await page.locator('#form-panel').innerText(),/Compare the clicked form\\/submitter/);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one lifecycle loop target, found {text.count(old)}')
          text = text.replace(old, new)

          old = "  assert.match(await page.locator('#document-panel').innerText(),/same-origin code can borrow/);"
          new = old + "\n  assert.match(await page.locator('#form-panel').innerText(),/Earlier and selected reports belong to the same reporting document/);\n  assert.match(await page.locator('#form-panel').innerText(),/not interaction or native causality/);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one borrowed-function target, found {text.count(old)}')
          smoke.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/patch-observatory-lifecycle-copy.yml').unlink()

      - name: Run reader contracts
        run: node --test experiments/evidence-observatory/tests/form-documents.test.mjs experiments/evidence-observatory/tests/form-trace.test.mjs

      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/evidence-observatory/render.mjs \
            experiments/evidence-observatory/smoke-documents.mjs \
            .github/workflows/patch-observatory-lifecycle-copy.yml
          git commit -m "fix(observatory): distinguish lifecycle report snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
