name: Issue 688 exact-source publication and qualification
on:
  push:
    branches: [fix/688-effective-form-authority-20260913]
    paths: [.github/workflows/688-source-checkout.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply verified candidate and remove transport files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/688-effective-form-authority-20260913
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          payload = ''.join(Path(f'.github/issue688.{i}.b64').read_text() for i in range(3))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ef2f3acec1bac3b065290173a3b8983c53461d04b1bb6d78a9061419b6b537d4'
          Path('/tmp/688.patch').write_bytes(patch)
          PY
          git apply --check /tmp/688.patch
          git apply --index /tmp/688.patch
          git rm .github/workflows/688-source-checkout.yml .github/issue688.[012].b64
          test "$(git write-tree)" = ea41d12fa186037d75fcea81513c5c55ffb04bf7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind child-form authority to effective one-use intent (#688)'
          git push origin HEAD:refs/heads/fix/688-effective-form-authority-20260913
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm test
      - run: npm run build
      - name: Preserve unchanged budget result without suppressing browser evidence
        id: budget
        continue-on-error: true
        run: npm run check:perf-budget
      - run: npx playwright install --with-deps chromium
      - name: Typed loopback form-authority campaign
        run: npx playwright test tests/e2e/issue688-form-intent.spec.ts --project=regression
      - name: Preserve campaign artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue688-campaign
          path: |
            test-results
            playwright-report
            extension/dist/manifest.json
          retention-days: 7
          if-no-files-found: warn
      - name: Keep budget failure a failed qualification
        if: always() && steps.budget.outcome == 'failure'
        run: exit 1
  export-review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ce6ff372bd4d5d90daaefad38d6bbd524e072350
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/export-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: issue691-review-source
          path: /tmp/export-review-source.tar.gz
          retention-days: 1
