name: Apply PR 938 security corrections

on:
  push:
    branches:
      - codex/812-form-mutation-telemetry-20260925
    paths:
      - .github/workflows/codex-apply-pr938.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded corrections
        run: python scripts/codex_apply_pr938.py

      - name: Format changed files
        run: >-
          npx prettier --write
          extension/src/content/mutation_monitor.ts
          tests/mutation-monitor-form-authority.test.ts
          tests/evidence-reasons.test.ts

      - name: Verify focused behavior
        run: >-
          npx vitest run
          tests/mutation-monitor-form-authority.test.ts
          tests/evidence-reasons.test.ts
          tests/explanations.test.ts

      - name: Verify lint and types
        run: |
          npm run lint
          npm run typecheck
          git diff --check

      - name: Publish correction and remove temporary machinery
        env:
          TARGET_BRANCH: codex/812-form-mutation-telemetry-20260925
        run: |
          rm scripts/codex_apply_pr938.py .github/workflows/codex-apply-pr938.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden form authority telemetry edge cases"
          git push origin "HEAD:${TARGET_BRANCH}"
