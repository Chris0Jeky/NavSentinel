name: Publish exact Observatory resilience candidate
on:
  push:
    branches: [feat/observatory-resilience-20260913]
    paths:
      - '.observatory-delivery-*'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/feat/observatory-resilience-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observatory-resilience-20260913
          fetch-depth: 2
      - name: Apply checksum-verified source, remove transport, verify exact tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '3a43fab52ad41d6885c1b2ecc9fd125daaeb638f'
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          text=''.join(pathlib.Path(f'.observatory-delivery-{i}').read_text() for i in range(1,5))
          patch=lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b0e157d55437a6c04b399fd1e2c2e415a85a70db121270e140db6f453676b919'
          pathlib.Path('/tmp/observatory-resilience.patch').write_bytes(patch)
          PY
          git apply --index /tmp/observatory-resilience.patch
          git rm .observatory-delivery-1 .observatory-delivery-2 .observatory-delivery-3 .observatory-delivery-4 .github/workflows/observatory-delivery-once.yml
          test "$(git write-tree)" = '8aeb3b1e4e2d9987279836f2a542a2d7172bf2f5'
          git diff --cached --check
          git config user.name 'NavSentinel Development'
          git config user.email 'noreply@openai.com'
          git commit -m 'feat(observatory): qualify observer faults and frozen viewport timing challenges'
          test "$(git rev-parse HEAD^{tree})" = '8aeb3b1e4e2d9987279836f2a542a2d7172bf2f5'
          git push origin HEAD:refs/heads/feat/observatory-resilience-20260913
          git rev-parse HEAD HEAD^{tree}
