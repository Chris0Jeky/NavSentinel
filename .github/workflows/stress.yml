name: Stress Tests

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Stress Lane
    runs-on: ubuntu-latest
    # Bound a hung stress process while leaving the failure-trace upload time
    # to run after the test-step timeout fires.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run stress tests
        timeout-minutes: 30
        run: xvfb-run -a npm run test:e2e:stress

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: stress-traces
          path: test-results/
          retention-days: 7
