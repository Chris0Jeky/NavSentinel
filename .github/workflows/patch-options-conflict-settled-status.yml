name: Patch Options conflict completion barrier

on:
  push:
    branches:
      - test/options-conflict-settle-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply review repair
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("tests/e2e/suite-ui.spec.ts")
          text = source_path.read_text(encoding="utf-8")
          old = '''    let firstConflict = false;
              let secondConflict = false;
              await expect.poll(async () => {
                [firstConflict, secondConflict] = await Promise.all([
                  first.locator("#settingsConflict").isVisible(),
                  second.locator("#settingsConflict").isVisible(),
                ]);
                return Number(firstConflict) + Number(secondConflict);
              }).toBe(1);
          '''
          new = '''    const savedStatus = "Saved.";
              const conflictStatus = "Settings changed in another window.";
              const settledStatus = /^(?:Saved\\.|Settings changed in another window\\.)$/;
              const readSettledStatus = async (page: typeof first): Promise<string> => {
                const status = page.locator("#saveStatus");
                await expect(status).toHaveText(settledStatus);
                return status.innerText();
              };
              const [firstStatus, secondStatus] = await Promise.all([
                readSettledStatus(first),
                readSettledStatus(second),
              ]);
              expect([firstStatus, secondStatus].sort()).toEqual([savedStatus, conflictStatus]);

              const [firstConflict, secondConflict] = await Promise.all([
                first.locator("#settingsConflict").isVisible(),
                second.locator("#settingsConflict").isVisible(),
              ]);
              expect(Number(firstConflict) + Number(secondConflict)).toBe(1);
              expect(firstConflict).toBe(firstStatus === conflictStatus);
              expect(secondConflict).toBe(secondStatus === conflictStatus);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one target block, found {text.count(old)}")
          source_path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/patch-options-conflict-settled-status.yml").unlink()

      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/suite-ui.spec.ts .github/workflows/patch-options-conflict-settled-status.yml
          git commit -m "test: wait for both Options saves to finish"
          git push origin "HEAD:${GITHUB_REF_NAME}"
