name: One-off export preview synchronization

on:
  push:
    branches: [fix/export-privacy-boundaries-20260912]
    paths: [.github/workflows/oneoff-export-previews-20260912.yml]

permissions:
  contents: read

jobs:
  synchronize:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/fix/export-privacy-boundaries-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Regenerate only the checked-in standalone previews
        run: |
          set -euo pipefail
          npm run vision:build
          git diff --check
          git add -- experiments/vision-lab/NavSentinel-Browser.html experiments/vision-lab/NavSentinel-Desktop.html experiments/vision-lab/NavSentinel-Intent-Relay.html
          git rm -- .github/workflows/oneoff-export-previews-20260912.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: synchronize standalone evidence previews and remove one-off job'
          git rev-parse HEAD^{tree}
          git push origin HEAD:refs/heads/fix/export-privacy-boundaries-20260912
