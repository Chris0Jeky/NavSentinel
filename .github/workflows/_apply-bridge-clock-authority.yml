name: Apply bridge clock authority patch

on:
  push:
    branches:
      - fix/bridge-local-clock-authority-20260920

permissions:
  contents: write

concurrency:
  group: apply-bridge-clock-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/bridge-local-clock-authority-20260920

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm

      - name: Apply receiver-owned clock boundary
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement anchor, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          Path("extension/src/content/main_world_clock.ts").write_text(
              '''/**
           * MAIN-world code shares the page's JavaScript realm. Capture Date.now at
           * module initialization so a later page replacement cannot forge TTL and
           * correlation timestamps produced by NavSentinel.
           */
          const capturedDateNow = Date.now.bind(Date);

          export function mainWorldNowMs(): number {
            return capturedDateNow();
          }
          ''',
              encoding="utf-8",
          )

          Path("extension/src/content/clipboard_bridge.ts").write_text(
              '''import { recordClipboardWrite } from "./clickfix_detector";

          export interface ClipboardBridgeMetadata {
            /** Untrusted producer timestamp retained only as bridge metadata. */
            ts?: unknown;
            contentLength?: unknown;
            looksLikeCommand?: unknown;
          }

          /**
           * Admit MAIN-world clipboard metadata using isolated-world receipt time.
           * The producer timestamp is deliberately ignored for freshness authority.
           */
          export function recordClipboardBridgeWrite(
            data: ClipboardBridgeMetadata,
            receivedAtMs = Date.now(),
          ): void {
            const receiptTs = Number.isFinite(receivedAtMs) ? receivedAtMs : Date.now();
            recordClipboardWrite({
              ts: receiptTs,
              contentLength: typeof data.contentLength === "number" ? data.contentLength : -1,
              looksLikeCommand: data.looksLikeCommand === true,
            });
          }
          ''',
              encoding="utf-8",
          )

          replace_once(
              "extension/src/content/main_guard.ts",
              '''} from "./main_guard_constants";
''',
              '''} from "./main_guard_constants";
import { mainWorldNowMs as nowMs } from "./main_world_clock";
''',
          )
          replace_once(
              "extension/src/content/main_guard.ts",
              '''function nowMs(): number {
  return Date.now();
}

''',
              "",
          )

          replace_once(
              "extension/src/content/pushstate_guard.ts",
              '''export function handlePushStateBridgeMessage(
  type: string,
  data: { ts?: number; url?: string; method?: string; reason?: string },
): boolean {
  if (type === "ns-pushstate-suspicious") {
    pushStateAbuseTs = typeof data.ts === "number" ? data.ts : Date.now();
''',
              '''export function handlePushStateBridgeMessage(
  type: string,
  data: { ts?: number; url?: string; method?: string; reason?: string },
  receivedAtMs = Date.now(),
): boolean {
  if (type === "ns-pushstate-suspicious") {
    // MAIN-world producer time is page-controlled metadata. Freshness begins
    // when the isolated world receives the authenticated bridge message.
    pushStateAbuseTs = Number.isFinite(receivedAtMs) ? receivedAtMs : Date.now();
''',
          )

          replace_once(
              "extension/src/content/dblclick_guard.ts",
              '''export function handleDblclickBridgeMessage(
  type: string,
  data: Record<string, unknown>,
): { handled: boolean; forwardToSW?: { type: string; url: string; ts: number } } {
  if (type === "ns-dblclick-window-open") {
    dblclickWindowOpenTs = typeof data.ts === "number" ? data.ts : Date.now();
''',
              '''export function handleDblclickBridgeMessage(
  type: string,
  data: Record<string, unknown>,
  receivedAtMs = Date.now(),
): { handled: boolean; forwardToSW?: { type: string; url: string; ts: number } } {
  const receiptTs = Number.isFinite(receivedAtMs) ? receivedAtMs : Date.now();

  if (type === "ns-dblclick-window-open") {
    // Producer timestamps remain untrusted metadata; correlation TTLs use the
    // isolated world's authenticated bridge receipt time.
    dblclickWindowOpenTs = receiptTs;
''',
          )
          replace_once(
              "extension/src/content/dblclick_guard.ts",
              '''  if (type === "ns-dblclick-opener-nav") {
    dblclickOpenerNavTs = typeof data.ts === "number" ? data.ts : Date.now();
''',
              '''  if (type === "ns-dblclick-opener-nav") {
    dblclickOpenerNavTs = receiptTs;
''',
          )
          replace_once(
              "extension/src/content/dblclick_guard.ts",
              '''  if (type === "ns-dblclick-second-click") {
    dblclickSecondClickTs = typeof data.ts === "number" ? data.ts : Date.now();
''',
              '''  if (type === "ns-dblclick-second-click") {
    dblclickSecondClickTs = receiptTs;
''',
          )
          replace_once(
              "extension/src/content/dblclick_guard.ts",
              '''export function handleDblclickRuntimeMessage(message: Record<string, unknown> | null | undefined): boolean {
  if (!message) return false;

  if (message.type === "ns-dblclick-child-closed") {
    dblclickChildClosed = true;
    dblclickChildClosedTs = Date.now();
''',
              '''export function handleDblclickRuntimeMessage(
  message: Record<string, unknown> | null | undefined,
  receivedAtMs = Date.now(),
): boolean {
  if (!message) return false;
  const receiptTs = Number.isFinite(receivedAtMs) ? receivedAtMs : Date.now();

  if (message.type === "ns-dblclick-child-closed") {
    dblclickChildClosed = true;
    dblclickChildClosedTs = receiptTs;
''',
          )
          replace_once(
              "extension/src/content/dblclick_guard.ts",
              '''  if (message.type === "ns-dblclick-opener-nav-from-child") {
    dblclickOpenerNavTs = typeof message.ts === "number" ? message.ts : Date.now();
''',
              '''  if (message.type === "ns-dblclick-opener-nav-from-child") {
    // The worker-forwarded timestamp describes its producer; this document's
    // receipt time owns the local correlation window.
    dblclickOpenerNavTs = receiptTs;
''',
          )

          replace_once(
              "extension/src/content/capture_isolated.ts",
              '''import { recordClipboardWrite, scanForClickFix } from "./clickfix_detector";
''',
              '''import { scanForClickFix } from "./clickfix_detector";
import { recordClipboardBridgeWrite } from "./clipboard_bridge";
''',
          )
          replace_once(
              "extension/src/content/capture_isolated.ts",
              '''  if (data.type === "ns-clipboard-write") {
    const ts = typeof data.ts === "number" ? data.ts : Date.now();
    const contentLength = typeof data.contentLength === "number" ? data.contentLength : -1;
    const cmdLike = typeof data.looksLikeCommand === "boolean" ? data.looksLikeCommand : false;
    recordClipboardWrite({ ts, contentLength, looksLikeCommand: cmdLike });
    if (settings.defaultMode !== "off") {
      handleClickFixScan();
    }
    return;
  }

  // --- DoubleClickjacking bridge messages from main_guard ---
  {
    const dblResult = handleDblclickBridgeMessage(data.type ?? "", data);
''',
              '''  const receivedAtMs = Date.now();

  if (data.type === "ns-clipboard-write") {
    recordClipboardBridgeWrite({
      ts: data.ts,
      contentLength: data.contentLength,
      looksLikeCommand: data.looksLikeCommand,
    }, receivedAtMs);
    if (settings.defaultMode !== "off") {
      handleClickFixScan();
    }
    return;
  }

  // --- DoubleClickjacking bridge messages from main_guard ---
  {
    const dblResult = handleDblclickBridgeMessage(data.type ?? "", data, receivedAtMs);
''',
          )
          replace_once(
              "extension/src/content/capture_isolated.ts",
              '''  if (handlePushStateBridgeMessage(data.type ?? "", data)) {
''',
              '''  if (handlePushStateBridgeMessage(data.type ?? "", data, receivedAtMs)) {
''',
          )

          replace_once(
              "tests/pushstate-guard.test.ts",
              '''    it("returns false after stale period (>10s)", () => {
      const oldTs = Date.now() - 11_000;
      handlePushStateBridgeMessage("ns-pushstate-suspicious", {
        ts: oldTs,
        url: "/accounts.chase.com/login",
      });
      expect(isPushStateAbuseActive()).toBe(false);
    });
''',
              '''    it("does not let a stale producer timestamp expire a fresh receipt", () => {
      const oldTs = Date.now() - 11_000;
      handlePushStateBridgeMessage("ns-pushstate-suspicious", {
        ts: oldTs,
        url: "/accounts.chase.com/login",
      });
      expect(isPushStateAbuseActive()).toBe(true);
    });
''',
          )

          Path("tests/main-world-clock.test.ts").write_text(
              '''import { afterEach, describe, expect, it, vi } from "vitest";

          const originalDateNow = Object.getOwnPropertyDescriptor(Date, "now");

          afterEach(() => {
            if (originalDateNow) Object.defineProperty(Date, "now", originalDateNow);
            vi.resetModules();
          });

          describe("mainWorldNowMs", () => {
            it("keeps the initialization-captured clock after the page replaces Date.now", async () => {
              Object.defineProperty(Date, "now", {
                configurable: true,
                writable: true,
                value: () => 123_456,
              });
              vi.resetModules();
              const { mainWorldNowMs } = await import("../extension/src/content/main_world_clock");

              Object.defineProperty(Date, "now", {
                configurable: true,
                writable: true,
                value: () => 999_999,
              });

              expect(mainWorldNowMs()).toBe(123_456);
            });
          });
          ''',
              encoding="utf-8",
          )

          Path("tests/clipboard-bridge.test.ts").write_text(
              '''import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { recordClipboardBridgeWrite } from "../extension/src/content/clipboard_bridge";
          import {
            _resetClipboardEvents,
            hasRecentClipboardWrite,
            hasRecentCommandClipboardWrite,
          } from "../extension/src/content/clickfix_detector";

          const NOW = 2_000_000_000_000;

          describe("recordClipboardBridgeWrite", () => {
            beforeEach(() => {
              vi.useFakeTimers();
              vi.setSystemTime(NOW);
              _resetClipboardEvents();
            });

            afterEach(() => {
              _resetClipboardEvents();
              vi.useRealTimers();
            });

            it("ignores a future producer timestamp for expiry authority", () => {
              recordClipboardBridgeWrite({
                ts: NOW + 86_400_000,
                contentLength: 42,
                looksLikeCommand: true,
              });
              expect(hasRecentCommandClipboardWrite()).toBe(true);

              vi.advanceTimersByTime(30_001);
              expect(hasRecentClipboardWrite()).toBe(false);
            });

            it("keeps a freshly received event despite a stale producer timestamp", () => {
              recordClipboardBridgeWrite({
                ts: NOW - 86_400_000,
                contentLength: 12,
                looksLikeCommand: false,
              });

              expect(hasRecentClipboardWrite()).toBe(true);
            });
          });
          ''',
              encoding="utf-8",
          )

          Path(".github/workflows/_apply-bridge-clock-authority.yml").unlink()
          PY

      - name: Check patch shape
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression suite
        run: >-
          npx vitest run
          tests/bridge-clock-authority.test.ts
          tests/pushstate-guard.test.ts
          tests/dblclick-guard.test.ts
          tests/clipboard-bridge.test.ts
          tests/main-world-clock.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make bridge freshness receiver-owned"
          git push origin HEAD:"${GITHUB_REF_NAME}"
