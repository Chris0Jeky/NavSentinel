name: Temporary PR 712 patch publisher

on:
  push:
    branches:
      - fix/692-release-input-integrity-20260915

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/692-release-input-integrity-20260915
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Apply exclusion-ancestor regression repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/release-input-integrity.mjs")
          script = script_path.read_text(encoding="utf-8")

          if "function isAncestorOfExcludedProjectPath" not in script:
            helper_anchor = "\nfunction assertContainedRealPath(repositoryRoot, absolutePath, relativePath) {"
            if script.count(helper_anchor) != 1:
              raise SystemExit("expected one helper insertion anchor")
            helper = (
              "\nfunction isAncestorOfExcludedProjectPath(relativePath, excludedPrefixes) {\n"
              "  return excludedPrefixes.some((prefix) => prefix.startsWith(`${relativePath}/`));\n"
              "}\n"
            )
            script = script.replace(helper_anchor, helper + helper_anchor)

          walker_marker = "isAncestorOfExcludedProjectPath(relativePath, excludedPrefixes)"
          walker_start = script.index("function assertNoUntrackedProjectInputs")
          if walker_marker not in script[walker_start:]:
            terminal = "      if (!stats.isFile() && !stats.isDirectory()) {"
            terminal_at = script.index(terminal, walker_start)
            insertion = (
              "      if (\n"
              "        stats.isDirectory() &&\n"
              "        isAncestorOfExcludedProjectPath(relativePath, excludedPrefixes)\n"
              "      ) {\n"
              "        assertContainedRealPath(repositoryRoot, absolutePath, relativePath);\n"
              "        visit(relativePath);\n"
              "        continue;\n"
              "      }\n"
            )
            script = script[:terminal_at] + insertion + script[terminal_at:]
          script_path.write_text(script, encoding="utf-8")

          test_path = Path("tests/release-input-integrity.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          test_start = tests.index(
            'it("excludes dependency and generated-output roots from the project-input claim"'
          )
          sibling_marker = 'path.join(root, "extension", "unexpected.txt")'
          if sibling_marker not in tests[test_start:]:
            assertion = "    expect(() => assertExactCommittedInputs(root)).not.toThrow();"
            assertion_at = tests.index(assertion, test_start) + len(assertion)
            insertion = (
              "\n\n"
              '    fs.writeFileSync(path.join(root, "extension", "unexpected.txt"), "unexpected\\n");\n'
              "    expect(() => assertExactCommittedInputs(root)).toThrow(\n"
              "      /untracked or ignored project input/i,\n"
              "    );"
            )
            tests = tests[:assertion_at] + insertion + tests[assertion_at:]
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install and verify focused repair
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/release-input-integrity.test.ts tests/release-scripts-parse.test.ts
          git diff --check
      - name: Publish repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr-712-patch.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add scripts/release-input-integrity.mjs tests/release-input-integrity.test.ts .github/workflows/tmp-pr-712-patch.yml
          git commit -m "fix: traverse declared release exclusion ancestors"
          git push origin HEAD:fix/692-release-input-integrity-20260915
