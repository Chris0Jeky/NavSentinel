name: Temporary PR 712 patch publisher

on:
  push:
    branches:
      - fix/692-release-input-integrity-20260915

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/692-release-input-integrity-20260915
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          cache: npm
      - name: Apply exclusion-ancestor regression repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/release-input-integrity.mjs')
          script = script_path.read_text(encoding='utf-8')
          helper_needle = '''function isExcludedProjectPath(relativePath, excludedPrefixes) {
            const segments = relativePath.split("/");
            if (segments.some((segment) => DEFAULT_EXCLUDED_SEGMENTS.has(segment))) return true;
            return excludedPrefixes.some(
              (prefix) => relativePath === prefix || relativePath.startsWith(`${prefix}/`),
            );
          }
          '''
          helper_replacement = helper_needle + '''
          function isAncestorOfExcludedProjectPath(relativePath, excludedPrefixes) {
            return excludedPrefixes.some((prefix) => prefix.startsWith(`${relativePath}/`));
          }
          '''
          if script.count(helper_needle) != 1:
            raise SystemExit('expected one exclusion helper block')
          script = script.replace(helper_needle, helper_replacement)

          visit_needle = '''      if (trackedDirectories.has(relativePath)) {
                if (!stats.isDirectory()) {
                  throw integrityError(`tracked directory '${relativePath}' is not a directory`);
                }
                assertContainedRealPath(repositoryRoot, absolutePath, relativePath);
                visit(relativePath);
                continue;
              }
              if (!stats.isFile() && !stats.isDirectory()) {
          '''
          visit_replacement = '''      if (trackedDirectories.has(relativePath)) {
                if (!stats.isDirectory()) {
                  throw integrityError(`tracked directory '${relativePath}' is not a directory`);
                }
                assertContainedRealPath(repositoryRoot, absolutePath, relativePath);
                visit(relativePath);
                continue;
              }
              if (
                stats.isDirectory() &&
                isAncestorOfExcludedProjectPath(relativePath, excludedPrefixes)
              ) {
                assertContainedRealPath(repositoryRoot, absolutePath, relativePath);
                visit(relativePath);
                continue;
              }
              if (!stats.isFile() && !stats.isDirectory()) {
          '''
          if script.count(visit_needle) != 1:
            raise SystemExit('expected one untracked-directory decision block')
          script = script.replace(visit_needle, visit_replacement)
          script_path.write_text(script, encoding='utf-8')

          test_path = Path('tests/release-input-integrity.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          test_needle = '''    fs.writeFileSync(path.join(root, "extension", "dist", "generated.js"), "generated\\n");

              expect(() => assertExactCommittedInputs(root)).not.toThrow();
            });
          '''
          test_replacement = '''    fs.writeFileSync(path.join(root, "extension", "dist", "generated.js"), "generated\\n");

              expect(() => assertExactCommittedInputs(root)).not.toThrow();

              fs.writeFileSync(path.join(root, "extension", "unexpected.txt"), "unexpected\\n");
              expect(() => assertExactCommittedInputs(root)).toThrow(
                /untracked or ignored project input/i,
              );
            });
          '''
          if tests.count(test_needle) != 1:
            raise SystemExit('expected one generated-output regression block')
          tests = tests.replace(test_needle, test_replacement)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install and verify focused repair
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/release-input-integrity.test.ts tests/release-scripts-parse.test.ts
          git diff --check
      - name: Publish repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr-712-patch.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add scripts/release-input-integrity.mjs tests/release-input-integrity.test.ts .github/workflows/tmp-pr-712-patch.yml
          git commit -m "fix: traverse declared release exclusion ancestors"
          git push origin HEAD:fix/692-release-input-integrity-20260915
