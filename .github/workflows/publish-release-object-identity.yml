name: Publish verified release object identity repair
on:
  push:
    branches: [fix/release-object-identity-20261001]
    paths: [.github/workflows/publish-release-object-identity.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Chris0Jeky/NavSentinel' && github.ref == 'refs/heads/fix/release-object-identity-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact tested patch and remove transport
        env:
          PATCH_GZIP_BASE64: >-
            H4sIAAAAAAAC/+1c63bbOJL+n6dA62Qm0kiiLrEdxx132kmcTnbSSY7tzP5wPDElQhY7FKkhKV/a0QPtc+yLbV0AELxJsjszZ/bspvvYMgkUgKpC1VeFgjx/MhHd7oWfCrfnwK/pYtS7iuKvkyC6SnpXfujB724aL5K0O4oWoefGvkycm1kgRnfs8ADeyWux+2Rne3uwPXCcoecO5NPdsRj0+ztbWw+6 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9a4cb93d1b1053bc78ed813d13b23b2c43ef968c
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          encoded = ''.join(os.environ['PATCH_GZIP_BASE64'].split())
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 26665
          assert hashlib.sha256(patch).hexdigest() == '1d9a7a3827f3de59cacc7ab093ee97ed2b9f0bd45bf2074a5bcd6794e71e193f'
          pathlib.Path('/tmp/release-identity.patch').write_bytes(patch)
          PY
          git apply --check /tmp/release-identity.patch
          git apply --index /tmp/release-identity.patch
          git rm .github/workflows/publish-release-object-identity.yml
          git diff --cached --check
          test "$(git write-tree)" = f1541759117f070392466feed8dc9ba2b46ebf8e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): authenticate Git objects and raw commit parentage'
          git push origin HEAD:refs/heads/fix/release-object-identity-20261001
