authority_scope:
  actor: "one authored top-frame evasion fixture"
  task: "one trusted activation per armed destination in each campaign case; the mixed arm sequences one benign keyboard activation and one harm pointer activation"
  tab: "one fresh-profile initiating tab per arm plus its single consequence tab where navigation is allowed"
  frame: "top frame"
  document: "exact evasion-05-composite.html document plus one allowlisted mutation selector for each arm"
  destination: "one exact armed loopback fake-sink URL per arm, role, consequence, and target ID; both harm and benign assignments are normalized and compared before activation"
  bootstrap: "An immutable Playwright page-init resolver binds only the exact fixture origin/path and exact role/scenario/origin-mode keys. The sink enforces same-loopback as an equal hostname and alternate-loopback as a different hostname. It changes only one frozen, non-writable Window resolver; the browser lane proves assignment and redefinition are rejected. It injects no input, event, navigation, document-node mutation, product call, or decision."
  ttl: "one test run; the loopback sink closes in the test finally block"
  use_count: 1
  use_count_scope: "per armed destination"
  sink_revalidation: "The final fake sink independently validates active run, scenario, role, consequence, one-use target authority, and the exact inert sentinel on every request."
limitations:
  - "The exact receipt exercises the composite Evasion 05 control plus four deterministic neighbours across two CSS and two structural axes; it is not a randomized DOM, text, localization, timing, viewport, or holdout campaign."
  - "The mutation selector changes only one allowlisted opacity, z-index, wrapper-depth, or class-token axis and cannot select a destination, role, authority, or sink URL."
  - "The fixture marks an unrecognized mutation selector invalid, but this slice does not add a dedicated unknown-selector browser regression."
  - "The other eleven localized fixtures retain product-event-coupled regression checks and are not promoted beyond MODELLED."
  - "Bundled Chromium is not branded Chrome, owner Gate-3, open-web efficacy, or release evidence."
  - "Playwright page.addInitScript is privileged harness configuration only; it supplies no hostile or authored-page authority evidence, and SP-F-014 remains PARTIAL."
